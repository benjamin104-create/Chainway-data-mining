<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>替身相機</title>
<meta name="description" content="在手機上開啟相機，替自己召喚一個替身，拍照後直接分享到 LINE。">
<meta name="theme-color" content="#0d0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="替身相機">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap">
<style>
  /* 單一深色相機介面：畫面滿版，底部操作列 */
  :root {
    --ink: #0d0a14;
    --panel: rgba(13, 10, 20, .72);
    --line: rgba(255, 255, 255, .16);
    --fg: #f4f0ff;
    --muted: #a99fc4;
    --accent: #b15cff;
    --display: "Dela Gothic One", "Hiragino Sans", "Noto Sans TC", system-ui, sans-serif;
    --body: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--fg); font-family: var(--body); overflow: hidden; }
  body { display: grid; grid-template-rows: auto 1fr auto; }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
  }
  h1 { margin: 0; font: 400 20px/1 var(--display); letter-spacing: .04em; }
  h1 small { font: 500 11px/1 var(--body); color: var(--muted); letter-spacing: .12em; margin-left: 8px; }

  .stage { position: relative; min-height: 0; display: grid; place-items: center; overflow: hidden; }
  canvas#view { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; touch-action: manipulation; }
  video { display: none; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .35s ease-out; }
  .flash.on { opacity: .85; transition: none; }

  .notice {
    position: absolute; inset: auto 16px 16px; padding: 12px 14px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line); font-size: 14px; line-height: 1.55;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .start { position: absolute; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center; padding: 24px; }
  .start p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 30ch; }
  .start .big { font: 400 54px/1 var(--display); color: var(--accent); letter-spacing: .06em; text-shadow: 0 0 24px rgba(177, 92, 255, .55); }

  footer {
    display: grid; gap: 12px; padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
    background: linear-gradient(to top, var(--ink) 70%, transparent);
  }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--line); background: transparent; color: var(--fg);
    padding: 7px 12px; border-radius: 999px; font: 500 13px/1 var(--body); cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--ink); border-color: var(--fg); }
  .chip .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .ghost-btn {
    justify-self: start; border: 1px solid var(--line); background: transparent; color: var(--fg);
    width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  }
  .ghost-btn:last-child { justify-self: end; }
  .shutter {
    width: 74px; height: 74px; border-radius: 50%; border: 4px solid var(--fg); background: transparent;
    padding: 5px; cursor: pointer;
  }
  .shutter span { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--accent); transition: transform .12s; }
  .shutter:active span { transform: scale(.9); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  button:disabled { opacity: .4; }
  .primary {
    border: 0; background: var(--accent); color: #fff; padding: 13px 26px; border-radius: 999px;
    font: 600 16px/1 var(--body); cursor: pointer;
  }

  .sheet {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .82); display: grid; grid-template-rows: 1fr auto;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); gap: 14px;
  }
  .sheet img { max-width: 100%; max-height: 100%; margin: auto; display: block; border-radius: 8px; min-height: 0; }
  .sheet .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .sheet .hint { text-align: center; color: var(--muted); font-size: 13px; margin: 0; width: 100%; }
  .sheet a.primary { text-decoration: none; }
  .secondary { border: 1px solid var(--line); background: transparent; color: var(--fg); padding: 12px 22px; border-radius: 999px; font: 500 15px/1 var(--body); cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .flash { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>替身相機<small>STAND CAM</small></h1>
  <button class="ghost-btn" id="pick" aria-label="從相簿選照片" title="從相簿選照片" style="width:40px;height:40px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
  </button>
  <input type="file" id="file" accept="image/*" hidden>
</header>

<main class="stage" id="stage">
  <canvas id="view" width="720" height="960" aria-label="濾鏡預覽，點畫面可以讓替身換邊站"></canvas>
  <video id="video" playsinline muted></video>
  <div class="flash" id="flash"></div>
  <div class="start" id="start">
    <div class="big">ゴゴゴ</div>
    <p>開啟相機後，系統會把你從背景分出來，在你身後召喚一個替身。點畫面可以讓替身換邊站。</p>
    <div><button class="primary" id="go">開啟相機</button></div>
    <p id="loadState">正在載入人像辨識…</p>
  </div>
  <div class="notice" id="notice" hidden></div>
</main>

<footer>
  <div class="chips" id="styles" role="group" aria-label="替身顏色"></div>
  <div class="chips" id="sfx" role="group" aria-label="擬聲字"></div>
  <div class="controls">
    <button class="ghost-btn" id="side" aria-label="替身換邊" title="替身換邊">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h13l-3-3M17 17H4l3 3"/></svg>
    </button>
    <button class="shutter" id="shot" aria-label="拍照" disabled><span></span></button>
    <button class="ghost-btn" id="flip" aria-label="切換前後鏡頭" title="切換前後鏡頭">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9 13a3 3 0 0 1 5-2l1 1M15 13a3 3 0 0 1-5 2l-1-1"/></svg>
    </button>
  </div>
</footer>

<div class="sheet" id="sheet" hidden>
  <img id="result" alt="拍好的替身照片">
  <div class="row">
    <button class="primary" id="share">分享到 LINE／其他 App</button>
    <a class="secondary" id="save" download="stand.jpg">儲存照片</a>
    <button class="secondary" id="close">再拍一張</button>
    <p class="hint" id="saveHint">iPhone 也可以長按照片 →「加入照片」。</p>
  </div>
</div>

<script type="module" src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
