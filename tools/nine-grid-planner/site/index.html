<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E7EFF2">
<meta name="description" content="九宮格週計畫：把一週的待辦放進九個格子，四個面：行事曆、目標路線圖、心流歌單、友善連結。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="九宮格">
<script>window.NG_SITE=true;window.NG_SITE_URL="";</script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>九宮格週計畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Nunito:wght@600;800&display=swap">
<style>
:root{
  --skin-bg:#E7EFF2;--skin-accent:#E8833A;--skin-accent-d:#F2A65A;
  --c0:#F2994A;--c1:#2A9DA8;--c2:#E9B77E;--c3:#6FB3D9;--c4:#EE7B6A;--c5:#7FBF8E;--c6:#B48BD1;
  --bg:var(--skin-bg);
  --ink:#1B2735;
  --muted:#5B6878;
  --accent:var(--skin-accent);
  --on-accent:#FFFFFF;
  --g1:rgba(255,255,255,.74);
  --g2:rgba(255,255,255,.30);
  --edge:rgba(255,255,255,.82);
  --hl:rgba(255,255,255,.95);
  --chip:rgba(255,255,255,.84);
  --chip-edge:rgba(27,39,53,.08);
  --line:rgba(27,39,53,.10);
  --tint-a:26%;
  --shade:rgba(27,39,53,.32);
  --hi:#E5484D;--mid:#F0A928;--low:#9AA6B2;
  --hol:#D2453B;--hol-soft:rgba(229,72,77,.12);
  --art-op:.42;
  --wall-op:1;
  --f-ui:"Huninn","Noto Sans TC","PingFang TC","Hiragino Maru Gothic ProN","Hiragino Sans","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Nunito","Huninn",ui-rounded,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E131B;--ink:#EAF0F6;--muted:#9AA7B6;--accent:var(--skin-accent-d);--on-accent:#10151C;
    --g1:rgba(255,255,255,.11);--g2:rgba(255,255,255,.03);--edge:rgba(255,255,255,.14);--hl:rgba(255,255,255,.22);
    --chip:rgba(255,255,255,.08);--chip-edge:rgba(255,255,255,.08);--line:rgba(255,255,255,.1);--tint-a:30%;--shade:rgba(0,0,0,.6);
    --hi:#FF6B6F;--mid:#F5BE4B;--low:#6F7B8A;--hol:#FF8A80;--hol-soft:rgba(255,107,111,.16);--art-op:.28;
  }
}
:root[data-theme="dark"],:root.night{
  color-scheme:dark;
  --bg:#0E131B;--ink:#EAF0F6;--muted:#9AA7B6;--accent:var(--skin-accent-d);--on-accent:#10151C;
  --g1:rgba(255,255,255,.11);--g2:rgba(255,255,255,.03);--edge:rgba(255,255,255,.14);--hl:rgba(255,255,255,.22);
  --chip:rgba(255,255,255,.08);--chip-edge:rgba(255,255,255,.08);--line:rgba(255,255,255,.1);--tint-a:30%;--shade:rgba(0,0,0,.6);
  --hi:#FF6B6F;--mid:#F5BE4B;--low:#6F7B8A;--hol:#FF8A80;--hol-soft:rgba(255,107,111,.16);--art-op:.28;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#bgArt{position:fixed;inset:0;width:100%;height:100%;z-index:-2;opacity:var(--art-op);pointer-events:none}
#wall{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;pointer-events:none;opacity:var(--wall-op)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:2px}
svg{display:block}

/* ---------- jelly glass ---------- */
.jelly{position:relative;border-radius:var(--r,24px);
  background:linear-gradient(165deg,var(--g1),var(--g2) 62%),color-mix(in srgb,var(--t,#FFFFFF) var(--tint-a),transparent);
  border:1px solid var(--edge);
  box-shadow:inset 0 1px 1px var(--hl),inset 0 -14px 26px -10px color-mix(in srgb,var(--t,#8899AA) 34%,transparent),0 16px 30px -18px color-mix(in srgb,var(--t,#1B2735) 55%,var(--shade));
  -webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5)}
.jelly::before{content:"";position:absolute;left:12px;right:48%;top:5px;height:14px;border-radius:12px;background:linear-gradient(180deg,var(--hl),transparent);opacity:.5;pointer-events:none}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;--r:50%}
.round svg{width:18px;height:18px}
.pill{border-radius:999px;padding:7px 14px;font-size:13px;display:inline-flex;align-items:center;gap:6px;--r:999px;white-space:nowrap;text-decoration:none}
.pill svg{width:15px;height:15px;flex:none}
.pill.pri{background:linear-gradient(165deg,color-mix(in srgb,#fff 35%,var(--accent)),var(--accent));color:var(--on-accent);border-color:color-mix(in srgb,#fff 40%,var(--accent))}
.pill.pri::before{opacity:.35}

/* ---------- app frame ---------- */
.app{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:14px calc(118px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.hdr{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;--r:28px}
.logo{width:44px;height:44px;flex:none}
.htitle{display:flex;flex-direction:column;min-width:0;flex:1}
.htitle b{font-size:20px;font-weight:400;letter-spacing:.03em;line-height:1.2;text-wrap:balance}
.htitle span{font-size:12px;color:var(--muted)}
.hbtns{display:flex;gap:6px;align-items:center}
.region{appearance:none;border-radius:999px;padding:9px 12px;font:inherit;font-size:13px;color:var(--ink);max-width:128px;cursor:pointer}
.region option{color:#1B2735;background:#fff}

.stage{perspective:1500px}
.face{display:flex;flex-direction:column;gap:12px;transform-origin:50% 50%}

/* ---------- face 0: week ---------- */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.navlabel{display:flex;flex-direction:column;min-width:0;padding-inline:2px}
.navlabel b{font-size:18px;font-weight:400;line-height:1.2}
.navlabel span{font-family:var(--f-num);font-size:12px;color:var(--muted);font-weight:600}
.bar .grow{flex:1}
.seg{display:inline-flex;padding:3px;border-radius:999px;gap:2px;--r:999px}
.seg button{width:40px;height:32px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.seg button svg{width:17px;height:17px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
.hstrip{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hpill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12px;color:var(--hol);background:var(--hol-soft);border:1px solid color-mix(in srgb,var(--hol) 18%,transparent)}
.hpill em{font-style:normal;font-family:var(--f-num);font-weight:800}
.info{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-family:var(--f-num);font-weight:800;font-size:13px;border:1.5px solid currentColor}
.expill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 6px 4px 12px;font-size:12px;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.expill button{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:13px;line-height:1}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cell{min-height:176px;padding:12px 10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;--r:24px;transition:transform .25s var(--ease),box-shadow .25s}
.cell.over{transform:scale(1.03);box-shadow:0 0 0 3px var(--accent),0 16px 30px -12px var(--shade)}
.cell.day.pickable{cursor:copy}
.cell.center{--t:#FFFFFF}
.cell.prev{--t:#9AA6B2}
.cell.prev::after{content:"";position:absolute;inset:6px;border-radius:19px;border:1.5px dashed color-mix(in srgb,var(--muted) 45%,transparent);pointer-events:none}
.ch{display:flex;align-items:center;gap:6px;min-width:0;position:relative}
.dn{font-size:16px}
.dd{font-family:var(--f-num);font-weight:800;font-size:12px;color:var(--muted);border-radius:999px;padding:0 7px;background:var(--chip)}
.cnt{margin-left:auto;font-family:var(--f-num);font-weight:800;font-size:11px;color:var(--muted)}
.cell.today .dd{background:var(--accent);color:var(--on-accent)}
.cell.hol .dd{color:var(--hol)}
.cell.today.hol .dd{color:var(--on-accent)}
.htag{align-self:flex-start;font-size:11px;line-height:1.35;color:var(--hol);background:var(--hol-soft);border-radius:999px;padding:1px 8px;max-width:100%}
.ctitle{font-size:16px;display:flex;align-items:center;gap:6px}
.ctitle svg{width:16px;height:16px}
.cell.prev .ctitle{color:var(--muted)}
.empty{flex:1;display:grid;place-items:center;color:color-mix(in srgb,var(--muted) 55%,transparent)}
.empty svg{width:34px;height:34px}

.add{display:flex;flex-direction:column;gap:6px}
.add input{width:100%;min-width:0;border:1px solid var(--chip-edge);background:var(--chip);color:var(--ink);border-radius:16px;padding:8px 12px;font:inherit;font-size:16px}
.add input::placeholder{color:var(--muted)}
.addrow{display:flex;align-items:center;gap:5px}
.pp{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--chip);border:1px solid var(--chip-edge)}
.pp i{width:11px;height:11px;border-radius:50%;display:block;background:var(--c)}
.pp[aria-pressed="true"]{box-shadow:0 0 0 2px var(--c)}
.addbtn{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:20px;line-height:1;display:grid;place-items:center;box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 6px 14px -6px var(--accent)}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.chip{display:flex;align-items:flex-start;gap:4px;background:var(--chip);border:1px solid var(--chip-edge);border-radius:14px;padding:5px 5px 5px 7px;font-size:13px;line-height:1.4;user-select:none;-webkit-user-select:none;cursor:grab;box-shadow:0 2px 6px -3px var(--shade)}
.chip.sel{box-shadow:0 0 0 2.5px var(--accent)}
.chip.dragging{opacity:.3}
.chip.ringing{animation:ringing 1s ease-in-out 3}
@keyframes ringing{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 40%,transparent)}}
.grip{display:none;flex:none;width:14px;align-self:stretch;touch-action:none;cursor:grab;background:radial-gradient(circle,var(--muted) 1.2px,transparent 1.4px) 0 0/5px 5px;opacity:.7;margin:2px 0}
.dot{flex:none;width:18px;height:19px;display:grid;place-items:center}
.dot::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}
.p-high{--c:var(--hi)}.p-mid{--c:var(--mid)}.p-low{--c:var(--low)}
.txt{flex:1;min-width:0;text-align:left;overflow-wrap:anywhere}
.chip.done .txt{text-decoration:line-through;color:var(--muted)}
.chip.done .dot::before{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.gicon{flex:none;width:14px;height:19px;display:grid;place-items:center;color:var(--accent)}
.gicon svg{width:12px;height:12px}
.badge{flex:none;font-family:var(--f-num);font-weight:800;font-size:10px;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:999px;padding:1px 6px;margin-top:1px;white-space:nowrap}
.bell{flex:none;height:19px;min-width:18px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);opacity:0;font-family:var(--f-num);font-weight:800;font-size:11px;border-radius:999px}
.bell svg{width:13px;height:13px}
.bell.on{opacity:1;color:var(--accent);padding:0 4px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tin{flex:none;width:96px;font:inherit;font-size:12px;border:1.5px solid var(--accent);border-radius:10px;padding:0 4px;background:var(--chip);color:var(--ink)}
.x{flex:none;width:20px;height:19px;color:var(--muted);font-size:15px;line-height:1;opacity:0}
.chip:hover .x,.chip:focus-within .x,.chip:hover .bell,.chip:focus-within .bell{opacity:1}
.x:hover{color:var(--hi)}
@media (pointer:coarse){.grip{display:block}.x,.bell{opacity:.8}.chip{cursor:default}}
.ghost{position:fixed;left:0;top:0;z-index:80;pointer-events:none;box-shadow:0 14px 28px -10px var(--shade);opacity:.96}
body.is-dragging{cursor:grabbing}

/* month */
.mgrid{display:flex;flex-direction:column;gap:6px;padding:10px;--r:26px;--lbl:30px;--gap:6px}
.mhead,.mweek{display:grid;grid-template-columns:var(--lbl) repeat(7,minmax(0,1fr));gap:var(--gap);position:relative}
.mday{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.mday .sp{flex:none;height:calc(var(--lanes,0) * 21px)}
.mday.pick{background:color-mix(in srgb,var(--accent) 24%,var(--chip));box-shadow:inset 0 0 0 2px var(--accent);transform:none}
/* range bars ("Gantt") sit on a grid laid exactly over the seven day cells */
.mbars{position:absolute;left:calc(var(--lbl) + var(--gap));right:0;top:28px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:var(--gap);row-gap:3px;grid-auto-rows:18px;pointer-events:none;padding-inline:2px}
.gbar{--g:#F2994A;pointer-events:auto;display:block;min-width:0;height:18px;border-radius:999px;padding:0 8px;font-size:11px;line-height:17px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.22);
  background:linear-gradient(180deg,color-mix(in srgb,#fff 38%,var(--g)),color-mix(in srgb,var(--g) 82%,transparent));
  border:1px solid color-mix(in srgb,#fff 35%,var(--g));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.65),inset 0 -3px 6px color-mix(in srgb,#000 10%,var(--g)),0 4px 10px -4px var(--g);
  -webkit-touch-callout:none;user-select:none;-webkit-user-select:none;cursor:grab}
.gbar.cl{border-top-left-radius:6px;border-bottom-left-radius:6px}
.gbar.cr{border-top-right-radius:6px;border-bottom-right-radius:6px}
.gbar.moving{opacity:.75;box-shadow:0 0 0 2px var(--g),0 10px 18px -6px var(--g)}
.gbar.demo{position:fixed;left:0;top:0;z-index:85;pointer-events:none}
#mgrid .gbar{touch-action:none}
body.ranging{cursor:grabbing}
body.ranging .gbar{pointer-events:none}
.rtags{display:flex;flex-direction:column;gap:3px}
.rtags .gbar{height:17px;line-height:15px;font-size:10.5px}
.mh{font-size:12px;color:var(--muted);text-align:center;padding:2px 0}
.mh.we{color:var(--hol)}
.wk{font-family:var(--f-num);font-weight:800;font-size:11px;color:var(--muted);border-radius:12px;display:grid;place-items:center}
.wk:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.mday{min-height:78px;padding:6px 5px;border-radius:14px;background:var(--chip);border:1px solid var(--chip-edge);display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;min-width:0;transition:transform .2s var(--ease)}
.mday:hover{transform:translateY(-2px)}
.mday .num{font-family:var(--f-num);font-weight:800;font-size:13px;border-radius:999px;padding:0 6px}
.mday.out{opacity:.45}
.mday.hol .num{color:var(--hol)}
.mday.today .num{background:var(--accent);color:var(--on-accent)}
.mday .hn{font-size:10.5px;line-height:1.3;color:var(--hol);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.bars{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.bars i{width:8px;height:8px;border-radius:50%;background:var(--c);display:block}
.bars i.d{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.bars b{font-family:var(--f-num);font-size:10px;color:var(--muted);line-height:8px}

/* ---------- face 1: goal mandala + road ---------- */
.mandala{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mtile{aspect-ratio:1;max-width:100%;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-width:0;--r:26px;transition:transform .25s var(--ease)}
.mtile:hover{transform:translateY(-3px)}
.mnum{font-family:var(--f-num);font-weight:800;font-size:13px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--ink);flex:none}
.mtile.done .mnum{background:var(--t);color:#fff}
.mtext{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.mtile.done .mtext{color:var(--muted)}
.mtext.ph{color:var(--muted)}
.mdate{margin-top:auto;font-family:var(--f-num);font-weight:800;font-size:11px;border-radius:999px;padding:1px 8px;background:var(--chip);color:var(--muted)}
.mtile.center{align-items:center;justify-content:center;text-align:center;--t:var(--accent)}
.prog{width:60%;max-width:120px;position:relative}
.prog svg{width:100%;height:auto}
.prog b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:18px}
.mtile.center .mtext{font-size:15px;-webkit-line-clamp:2;text-align:center}
.road{padding:14px;--r:28px;--t:var(--c3)}
.road h3{margin:0 0 4px;font-size:15px;font-weight:400;display:flex;gap:6px;align-items:center}
.road h3 span{width:18px;height:18px;color:var(--accent)}
.road svg{width:100%;height:auto;overflow:visible}
.road .track{fill:none;stroke:color-mix(in srgb,var(--ink) 10%,transparent);stroke-width:18;stroke-linecap:round}
.road .walked{fill:none;stroke:var(--accent);stroke-width:18;stroke-linecap:round;opacity:.85}
.road .lane{fill:none;stroke:var(--chip);stroke-width:2;stroke-dasharray:6 8;stroke-linecap:round}
.road .node{cursor:pointer}
.road .node circle{stroke:var(--bg);stroke-width:3}
.road .node text{font-family:var(--f-num);font-weight:800;font-size:11px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.road .node.done text{fill:#fff}
.road .end text{font-size:11px;fill:var(--ink);text-anchor:middle}
.walker .body{animation:bob .5s ease-in-out infinite alternate;animation-play-state:paused}
.walker.moving .body{animation-play-state:running}
@keyframes bob{to{transform:translateY(-3px)}}

/* ---------- face 2: music ---------- */
.music{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stile{aspect-ratio:1;max-width:100%;border-radius:26px;overflow:hidden;position:relative;box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 16px 30px -18px var(--shade);border:1px solid var(--edge)}
.stile .cover{position:absolute;inset:0}
.stile .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(165deg,rgba(255,255,255,.35),rgba(255,255,255,0) 45%)}
.stile .tlink{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;text-decoration:none;color:var(--ink)}
.stile .lbl{border-radius:14px;padding:6px 9px;background:var(--g1);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--edge);min-width:0}
.stile .lbl b{display:block;font-weight:400;font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stile .lbl span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play{position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--g1);border:1px solid var(--edge);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .25s var(--ease)}
.play svg{width:14px;height:14px;margin-left:2px}
.stile:hover .play{transform:scale(1.12)}
.pen{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--g1);border:1px solid var(--edge);z-index:2}
.pen svg{width:13px;height:13px}
.stile.center .play{top:50%;left:50%;width:58px;height:58px;transform:translate(-50%,-62%);background:var(--accent);color:var(--on-accent)}
.stile.center .play svg{width:22px;height:22px}
.stile.center:hover .play{transform:translate(-50%,-62%) scale(1.08)}
.stile.blank{display:grid;place-items:center;color:var(--muted);--r:26px}
.stile.blank .plus{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:2px dashed currentColor;font-size:24px}

/* ---------- face 3: sponsors ---------- */
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border-radius:999px;padding:6px 13px;font-size:13px;background:var(--chip);border:1px solid var(--chip-edge);transition:transform .2s var(--ease)}
.tag[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent;transform:translateY(-1px)}
.spons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ptile{aspect-ratio:1;max-width:100%;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-width:0;text-decoration:none;--r:26px;transition:transform .25s var(--ease),box-shadow .25s}
.ptile .pic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--t);color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
.ptile .pic svg{width:20px;height:20px}
.ptile b{font-weight:400;font-size:14px;line-height:1.3}
.ptile small{font-size:11px;color:var(--muted);margin-top:auto}
.ptile.open::after{content:"";position:absolute;inset:6px;border-radius:21px;border:1.5px dashed color-mix(in srgb,var(--muted) 40%,transparent);pointer-events:none}
.ptile.match{box-shadow:0 0 0 3px var(--accent),0 18px 30px -16px var(--accent);transform:translateY(-3px)}
.fit{position:absolute;top:10px;right:10px;font-size:11px;border-radius:999px;padding:1px 8px;background:var(--accent);color:var(--on-accent)}
.ptile.center{align-items:center;justify-content:center;text-align:center;--t:var(--hi);gap:8px}
.heart{width:54px;height:54px;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.12)}24%{transform:scale(1)}36%{transform:scale(1.08)}}
.mini-seg{display:inline-flex;border-radius:999px;background:var(--chip);padding:2px;gap:2px}
.mini-seg button{border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.mini-seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ---------- dial ---------- */
.dial{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:4px;padding:7px;--r:999px}
.dial .fb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background .25s,color .25s,transform .25s var(--ease)}
.dial .fb svg{width:21px;height:21px}
.dial .fb[aria-current="true"]{background:var(--accent);color:var(--on-accent);box-shadow:inset 0 1px 1px rgba(255,255,255,.55),0 8px 16px -8px var(--accent);transform:translateY(-2px)}
.knob{width:56px;height:56px;border-radius:18px;margin-inline:4px;display:grid;place-items:center;background:var(--ink);color:var(--bg);box-shadow:inset 0 1px 1px rgba(255,255,255,.3),0 10px 20px -10px var(--shade)}
.knob svg{width:34px;height:34px;transition:transform .6s var(--ease)}

/* ---------- sheets, popovers, tips ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--ink) 28%,transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.scrim.mid{align-items:center}
.sheet{width:100%;max-width:560px;max-height:calc(100% - 24px);overflow:auto;padding:18px;--r:30px;--t:#FFFFFF;--g1:rgba(255,255,255,.93);--g2:rgba(255,255,255,.84);display:flex;flex-direction:column;gap:16px;animation:rise .35s var(--ease)}
:root.night .sheet,:root[data-theme="dark"] .sheet{--g1:rgba(30,38,52,.94);--g2:rgba(20,26,36,.92)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sheet{--g1:rgba(30,38,52,.94);--g2:rgba(20,26,36,.92)}}
@keyframes rise{from{transform:translateY(24px) scale(.97);opacity:0}}
.sheet h3{margin:0;font-size:16px;font-weight:400;display:flex;align-items:center;gap:8px}
.sheet h3 svg{width:18px;height:18px;color:var(--accent)}
.shead{display:flex;align-items:center;gap:8px}
.shead h2{margin:0;font-size:19px;font-weight:400;flex:1}
.sgroup{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.sw b{width:46px;height:46px;border-radius:16px;display:block;border:2px solid transparent;box-shadow:inset 0 1px 2px rgba(255,255,255,.7),0 6px 12px -6px var(--shade)}
.sw[aria-pressed="true"]{color:var(--ink)}
.sw[aria-pressed="true"] b{border-color:var(--ink)}
.upload{position:relative;overflow:hidden;cursor:pointer}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.rng{display:flex;align-items:center;gap:10px;font-size:13px}
.rng input{flex:1;accent-color:var(--accent)}
.tgl[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.note{font-size:12px;color:var(--muted);margin:0;line-height:1.6}
.status{font-size:12px;color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fld input{font:inherit;font-size:16px;color:var(--ink);background:var(--chip);border:1px solid var(--chip-edge);border-radius:16px;padding:9px 12px;width:100%;min-width:0}

/* scroll-wheel date pickers */
.wheels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wcol{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.wbox{position:relative}
.wheel{height:180px;overflow-y:scroll;scroll-snap-type:y mandatory;border-radius:20px;background:var(--chip);border:1px solid var(--chip-edge);scrollbar-width:none;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel ol{list-style:none;margin:0;padding:72px 0}
.wheel li{height:36px;display:flex;align-items:center;justify-content:center;gap:5px;scroll-snap-align:center;font-family:var(--f-num);font-weight:800;font-size:15px;color:var(--muted);cursor:pointer;transform-origin:50% 50%}
.wheel li small{font-family:var(--f-ui);font-weight:400;font-size:12px}
.wheel li.hol{color:var(--hol)}
.wheel li.on{color:var(--ink)}
.wheel li.hol.on{color:var(--hol)}
.band{position:absolute;left:6px;right:6px;top:72px;height:36px;border-radius:14px;pointer-events:none;background:color-mix(in srgb,var(--g) 16%,transparent);border:1.5px solid color-mix(in srgb,var(--g) 60%,transparent)}
.gsw{display:flex;flex-wrap:wrap;gap:8px}
.gsw button{width:32px;height:32px;border-radius:50%;background:linear-gradient(180deg,color-mix(in srgb,#fff 40%,var(--c)),var(--c));box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 4px 10px -5px var(--c)}
.gsw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.rprev{align-self:flex-start;max-width:100%;height:24px;line-height:22px;font-size:13px;padding:0 12px}

.tip{position:fixed;z-index:90;max-width:min(300px,calc(100% - 24px));padding:13px 14px 11px;border-radius:22px;background:var(--ink);color:var(--bg);box-shadow:0 18px 36px -14px var(--shade);animation:pop .35s var(--ease)}
.tip p{margin:0 0 10px;font-size:14px;line-height:1.55}
.tip .tail{position:absolute;width:16px;height:16px;background:var(--ink);transform:rotate(45deg);border-radius:3px}
.tip.below .tail{top:-6px}.tip.above .tail{bottom:-6px}
.tfoot{display:flex;align-items:center;gap:8px}
.tdots{display:flex;gap:4px;flex:1}
.tdots i{width:6px;height:6px;border-radius:50%;background:color-mix(in srgb,var(--bg) 35%,transparent)}
.tdots i.on{background:var(--bg);width:16px;border-radius:3px}
.tfoot button{font-size:13px;border-radius:999px;padding:5px 12px}
.tfoot .skip{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.tfoot .nx{background:var(--bg);color:var(--ink)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.spot{z-index:3;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 65%,transparent),0 0 0 12px color-mix(in srgb,var(--accent) 18%,transparent)!important;animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 65%,transparent),0 0 0 18px color-mix(in srgb,var(--accent) 8%,transparent)}}
.finger{position:fixed;left:0;top:0;z-index:85;width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--accent) 45%,transparent);border:3px solid #fff;box-shadow:0 6px 14px -4px var(--shade);pointer-events:none}

.float{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;border-radius:20px;padding:10px 14px;width:max-content;max-width:calc(100% - 32px);box-shadow:0 14px 28px -12px var(--shade);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.float .acts{display:flex;gap:6px;margin-left:auto}
.float button{border-radius:999px;padding:4px 11px;font-size:12px;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent)}
.float button.pri{background:var(--bg);color:var(--ink);border-color:var(--bg)}
#rem{bottom:calc(148px + env(safe-area-inset-bottom,0px))}

@media (max-width:600px){
  .app{gap:12px}
  .htitle b{font-size:17px}
  .hbtns .region{max-width:92px;padding-inline:10px}
  .grid,.mandala,.music,.spons{gap:7px}
  .cell{min-height:150px;padding:9px 6px;gap:5px;--r:20px}
  .dn,.ctitle{font-size:14px}
  .dd{font-size:11px;padding:0 5px}
  .cnt{display:none}
  .chip{font-size:12px;padding:4px 3px 4px 4px;gap:2px;flex-wrap:wrap;border-radius:12px}
  .dot{width:14px}.x{width:16px}
  .badge{display:none}
  .bell{min-width:14px}.bell svg{width:12px;height:12px}
  .bell.on{order:-1;flex-basis:100%;justify-content:flex-start;height:16px}
  .pp{width:22px;height:22px}
  .addbtn{width:30px;height:30px}
  .mtile,.ptile{padding:9px;--r:20px;gap:4px}
  .mtext,.mtile.center .mtext{font-size:12px}
  .mnum{width:22px;height:22px;font-size:11px}
  .ptile .pic{width:32px;height:32px;border-radius:11px}
  .ptile b{font-size:12px}
  .stile{border-radius:20px}
  .stile .lbl{padding:4px 7px;border-radius:11px}
  .stile .lbl b{font-size:11.5px}
  .stile .lbl span{display:none}
  .play{width:28px;height:28px;top:7px;left:7px}
  .pen{width:26px;height:26px;top:7px;right:7px}
  .stile.center .play{width:46px;height:46px}
  .mgrid{--lbl:22px;--gap:4px;gap:4px;padding:8px}
  .mbars{top:24px;padding-inline:1px}
  .gbar{font-size:10px;padding:0 5px}
  .mday{min-height:62px;padding:4px 3px;border-radius:11px}
  .mday .hn{font-size:9.5px}
  .dial .fb{width:42px;height:42px}
  .knob{width:50px;height:50px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  <button class="fb" type="button" data-face="2"></button>

<script>
(function(){
"use strict";

/* =========================================================

    example:"範例",clearExQ:"要清空範例，開始你自己的計畫嗎？",keep:"先保留",clear:"清空",

function spokenTime(t,l){

}

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");

const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;

  const l=D(y,m+1,0);return D(y,m,l.getDate()-((l.getDay()-wd+7)%7));
}

const LUNAR={
  2024:{lny:"2024-02-10",db:"2024-06-10",ma:"2024-09-17",qm:"2024-04-04"},
  2025:{lny:"2025-01-29",db:"2025-05-31",ma:"2025-10-06",qm:"2025-04-04"},

function TW(y,m){
  const L=LUNAR[y];const singles=[];

  one(D(y,1,1),"開國紀念日");one(D(y,2,28),"和平紀念日");one(D(y,5,1),"勞動節");one(D(y,10,10),"國慶日");
  if(y>=2025){one(D(y,9,28),"教師節");one(D(y,10,25),"臺灣光復節");one(D(y,12,25),"行憲紀念日")}
  if(L){
    const qm=parse(L.qm);
    if(qm.getMonth()===3&&qm.getDate()===4){
      put(m,qm,"兒童節・清明節");
      // Same day: Children's Day moves to the day before, or the day after when that is a Thursday.
      put(m,addDays(qm,qm.getDay()===4?1:-1),"兒童節補假");
    }else{one(D(y,4,4),"兒童節");one(qm,"清明節")}
    one(parse(L.db),"端午節");one(parse(L.ma),"中秋節");
    const lny=parse(L.lny);const block=[];
    if(y>=2026)block.push([addDays(lny,-2),"小年夜"]);
    block.push([addDays(lny,-1),"除夕"],[lny,"春節"],[addDays(lny,1),"春節"],[addDays(lny,2),"春節"]);
    let wk=0;for(const [d,n] of block){put(m,d,n);if(d.getDay()%6===0)wk++}

  }else{one(D(y,4,4),"兒童節")}
  for(const d of singles){
    if(d.getDay()===6){const t=addDays(d,-1);if(!has(m,t))put(m,t,"補假")}
    if(d.getDay()===0){const t=addDays(d,1);if(!has(m,t))put(m,t,"補假")}
  }
}
function JP(y,m){
  const n=y-1980;
  const spring=Math.floor(20.8431+0.242194*n-Math.floor(n/4));

  const base=[[D(y,1,1),"元日"],[nth(y,1,1,2),"成人の日"],[D(y,2,11),"建国記念の日"],[D(y,2,23),"天皇誕生日"],
    [D(y,3,spring),"春分の日"],[D(y,4,29),"昭和の日"],[D(y,5,3),"憲法記念日"],[D(y,5,4),"みどりの日"],[D(y,5,5),"こどもの日"],
    [nth(y,7,1,3),"海の日"],[D(y,8,11),"山の日"],[nth(y,9,1,3),"敬老の日"],[D(y,9,autumn),"秋分の日"],
    [nth(y,10,1,2),"スポーツの日"],[D(y,11,3),"文化の日"],[D(y,11,23),"勤労感謝の日"]];
  for(const [d,n] of base)put(m,d,n);
  // A weekday squeezed between two holidays becomes a holiday.
  for(let d=D(y,1,2);d.getFullYear()===y;d=addDays(d,1)){
    if(!has(m,d)&&d.getDay()!==0&&has(m,addDays(d,-1))&&has(m,addDays(d,1))&&m[key(addDays(d,-1))]!=="国民の休日")put(m,d,"国民の休日");
  }
  // A holiday on Sunday moves to the next day that is not already a holiday.
  for(const [d] of base){if(d.getDay()===0){let t=addDays(d,1);while(has(m,t))t=addDays(t,1);put(m,t,"振替休日")}}
}

function drawArt(){
  const c=$("bgArt");if(wall)return;
  const dpr=Math.min(2,window.devicePixelRatio||1),w=innerWidth,h=innerHeight;
  c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);
  const x=c.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
  const pal=skin().art,cell=Math.max(90,Math.min(150,w/5));
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let gy=0;gy<h+cell;gy+=cell)for(let gx=0;gx<w+cell;gx+=cell){
    const col=pal[Math.floor(rnd()*pal.length)],col2=pal[Math.floor(rnd()*pal.length)],t=Math.floor(rnd()*7);
    x.fillStyle=col;x.strokeStyle=col2;
    if(t===0){x.beginPath();x.moveTo(gx,gy+cell);x.arc(gx,gy+cell,cell,-Math.PI/2,0);x.closePath();x.fill()}
    else if(t===1){x.beginPath();x.arc(gx+cell/2,gy,cell/2,0,Math.PI);x.fill()}
    else if(t===2){x.beginPath();x.arc(gx+cell/2,gy+cell/2,cell*.34,0,Math.PI*2);x.fill()}
    else if(t===3){x.beginPath();x.arc(gx,gy+cell/2,cell/2,-Math.PI/2,Math.PI/2);x.fill()}
    else if(t===4){x.lineWidth=cell/14;x.lineCap="round";for(let i=1;i<5;i++){x.beginPath();x.moveTo(gx+i*cell/5,gy+cell*.15);x.lineTo(gx+i*cell/5,gy+cell*.85);x.stroke()}}
    else if(t===5){x.beginPath();x.moveTo(gx+cell,gy);x.arc(gx+cell,gy,cell,Math.PI/2,Math.PI);x.closePath();x.fill()}
  }
}

function rgbToAccent(r,g,b){

  if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}
  const s=Math.round(Math.min(.75,Math.max(.45,d?d/(1-Math.abs(mx+mn-1)):0))*100);
  return {l:`hsl(${Math.round(h)} ${s}% 42%)`,d:`hsl(${Math.round(h)} ${s}% 68%)`};
}

function chime(){
  if(!actx)return;
  try{const t0=actx.currentTime;[[880,0],[1175,.18],[1568,.36]].forEach(([f,dt])=>{
    const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=f;
    g.gain.setValueAtTime(0,t0+dt);g.gain.linearRampToValueAtTime(.18,t0+dt+.02);g.gain.exponentialRampToValueAtTime(.001,t0+dt+.5);
    o.connect(g).connect(actx.destination);o.start(t0+dt);o.stop(t0+dt+.55)})}catch(e){}
}

/* ---------- date spans (Gantt bars) ---------- */
const GCOL=["#F2994A","#EE7B6A","#F28CA6","#B48BD1","#6FB3D9","#2A9DA8","#7FBF8E","#F2C14E"];
const dayDiff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
// segments of every span that touches this week, stacked into as few lanes as possible
function weekRanges(mon){
  const a=key(mon),b=key(addDays(mon,6)),lanes=[],segs=[];
  S.ranges.filter(r=>r.start<=b&&r.end>=a).sort((x,y)=>x.start.localeCompare(y.start)||y.end.localeCompare(x.end)).forEach(r=>{
    const s=dayDiff(a,r.start<a?a:r.start),e=dayDiff(a,r.end>b?b:r.end);
    let lane=lanes.findIndex(end=>end<s);if(lane<0){lane=lanes.length;lanes.push(e)}else lanes[lane]=e;
    segs.push({r,s,e,lane,cl:r.start<a,cr:r.end>b});
  });
  return {segs,lanes:lanes.length};
}
function rangesOn(k){return S.ranges.filter(r=>r.start<=k&&r.end>=k).sort((x,y)=>x.start.localeCompare(y.start))}
let redit=null;   // span being edited: {id,start,end,color,from}
function openRange(opts){
  const t=T(),r=opts.id?S.ranges.find(x=>x.id===opts.id):null;
  if(opts.id&&!r)return;
  const start=r?r.start:opts.start,end=r?r.end:opts.end;
  const from=addDays(parse(start<end?start:end),-120);
  redit={id:r?r.id:null,start,end,color:r?r.color:(opts.color||GCOL[0]),from};
  const items=[];
  for(let i=0;i<420;i++){const d=addDays(from,i),hol=holiday(d);items.push(`<li data-i="${i}"${hol?` class="hol"`:""}>${d.getMonth()+1}/${d.getDate()}<small>${t.short[(d.getDay()+6)%7]}</small></li>`)}
  const list=`<ol>${items.join("")}</ol>`;
  layer(`<div class="shead"><h2>${r?t.rEdit:t.rNew}</h2>${closeBtn(t)}</div>
<span class="gbar rprev" id="rPrev" style="--g:${redit.color}">${esc(r?r.title||t.rUntitled:t.rUntitled)}</span>
<label class="fld">${t.rTitle}<input id="rTitle" type="text" maxlength="40" value="${esc(r?r.title:"")}"></label>
<div class="wheels" id="rWheels" style="--g:${redit.color}">
<div class="wcol">${t.rStart}<div class="wbox"><div class="wheel" id="wS" tabindex="0">${list}</div><i class="band"></i></div></div>
<div class="wcol">${t.rEnd}<div class="wbox"><div class="wheel" id="wE" tabindex="0">${list}</div><i class="band"></i></div></div>
</div>
<div class="row"><span class="hpill" id="rDays" style="color:var(--ink);background:var(--chip);border-color:var(--chip-edge)"></span></div>
<div class="gsw" role="group" aria-label="${t.rColor}">${GCOL.map(c=>`<button type="button" data-gcol="${c}" style="--c:${c}" aria-pressed="${c===redit.color}" aria-label="${c}"></button>`).join("")}</div>
<label class="fld">${t.rNote}<input id="rNote" type="text" maxlength="80" value="${esc(r&&r.note||"")}"></label>
<div class="row end">${r?`<button class="pill jelly" type="button" data-rng="del">${t.del}</button>`:""}<button class="pill pri jelly" type="button" data-rng="save">${t.save}</button></div>`,true);
  setupWheel($("wS"),"start");setupWheel($("wE"),"end");updateRangeInfo();
}
function setupWheel(el,which){
  const H=36,idx=()=>Math.max(0,Math.min(419,Math.round(el.scrollTop/H)));
  el.scrollTop=dayDiff(key(redit.from),redit[which])*H;
  let raf=0,timer=0;
  const paint=()=>{
    raf=0;const c=el.scrollTop/H;
    el.querySelectorAll("li").forEach((li,i)=>{const d=Math.abs(i-c);if(d>4){li.style.transform="";li.classList.remove("on");return}
      li.style.transform=`perspective(300px) rotateX(${Math.max(-60,Math.min(60,(i-c)*22))}deg) scale(${1-Math.min(d,3)*.06})`;li.classList.toggle("on",d<.5)});
  };
  paint();
  el.addEventListener("scroll",()=>{
    if(!raf)raf=requestAnimationFrame(paint);
    clearTimeout(timer);timer=setTimeout(()=>{
      if(!redit)return;
      redit[which]=key(addDays(redit.from,idx()));
      // keep start ≤ end by nudging the other wheel
      if(redit.start>redit.end){const o=which==="start"?"end":"start";redit[o]=redit[which];const w=$(o==="start"?"wS":"wE");if(w)w.scrollTo({top:dayDiff(key(redit.from),redit[o])*H,behavior:"smooth"})}
      updateRangeInfo();
    },110);
  },{passive:true});
  el.addEventListener("click",e=>{const li=e.target.closest("li");if(li)el.scrollTo({top:+li.dataset.i*H,behavior:"smooth"})});
  el.addEventListener("keydown",e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();el.scrollTo({top:(idx()+(e.key==="ArrowDown"?1:-1))*H,behavior:"smooth"})}});
}
function updateRangeInfo(){
  const t=T(),el=$("rDays");if(!el||!redit)return;
  el.textContent=`${t.md(parse(redit.start))} – ${t.md(parse(redit.end))} · ${t.rDays(dayDiff(redit.start,redit.end)+1)}`;
}

/* press-and-hold on a date, then drag, draws a new span; hold a bar and drag to move it */
let rp=null;
function dateAt(x,y){
  for(const el of document.querySelectorAll("#mgrid .mday")){const r=el.getBoundingClientRect();if(x>=r.left-3&&x<=r.right+3&&y>=r.top-3&&y<=r.bottom+3)return el.dataset.date}
  return null;
}
function paintPick(){
  if(!rp)return;const [a,b]=rp.anchor<rp.cur?[rp.anchor,rp.cur]:[rp.cur,rp.anchor];
  document.querySelectorAll("#mgrid .mday").forEach(el=>el.classList.toggle("pick",el.dataset.date>=a&&el.dataset.date<=b));
}
function rangeActivate(){
  if(!rp||rp.mode!=="wait")return;
  rp.mode=rp.rid?"move":"new";rp.cur=rp.anchor;document.body.classList.add("ranging");
  if(guide)endGuide(true);
  try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
  if(rp.mode==="move"){const r=S.ranges.find(x=>x.id===rp.rid);if(!r){rp=null;return}rp.orig={start:r.start,end:r.end};renderMonth()}
  else paintPick();
}
function rangeMove(e){
  if(!rp)return false;
  if(rp.mode==="wait"){
    if(Math.hypot(e.clientX-rp.x,e.clientY-rp.y)>8){if(rp.type==="mouse")rangeActivate();else{clearTimeout(rp.timer);rp=null;return false}}
    else return true;
  }
  e.preventDefault();
  const d=dateAt(e.clientX,e.clientY);
  if(d&&d!==rp.cur){
    rp.cur=d;
    if(rp.mode==="new")paintPick();
    else{const r=S.ranges.find(x=>x.id===rp.rid),k=dayDiff(rp.anchor,d);r.start=key(addDays(parse(rp.orig.start),k));r.end=key(addDays(parse(rp.orig.end),k));renderMonth()}
  }

}
function rangeEnd(e,commit){
  if(!rp)return false;
  const p=rp;rp=null;clearTimeout(p.timer);document.body.classList.remove("ranging");
  if(p.mode==="wait")return true;   // a plain tap: the click handler decides what it opens
  suppressUntil=Date.now()+400;
  if(p.mode==="new"){
    document.querySelectorAll("#mgrid .mday.pick").forEach(el=>el.classList.remove("pick"));
    if(commit){const [a,b]=p.anchor<p.cur?[p.anchor,p.cur]:[p.cur,p.anchor];openRange({start:a,end:b})}
  }else{
    const r=S.ranges.find(x=>x.id===p.rid);
    if(!commit&&r){r.start=p.orig.start;r.end=p.orig.end}
    save();renderMonth();
    if(commit&&p.cur===p.anchor&&r)openRange({id:r.id});
  }

}

  const P=skin().art,h=hash(seed),c1=P[h%P.length],c2=P[(h>>>3)%P.length],v=(h>>>9)%4;

function find(src,id,day){
  const w=W(key(cur));
  if(src==="inbox")return {list:w.inbox,item:w.inbox.find(x=>x.id===id)};
  if(src==="day")return {list:w.days[day],item:w.days[day].find(x=>x.id===id)};

}

function drop(src,id,day,slot){
  const w=W(key(cur)),{list,item}=find(src,id,day);if(!item||slot==="prev")return;
  if(slot==="inbox"){
    if(src==="day"){list.splice(list.indexOf(item),1);w.inbox.push({id:uid(),text:item.text,pri:item.pri})}
    else if(src==="prev")w.inbox.push({id:uid(),text:item.text,pri:item.pri});
    else return;
  }else{
    const to=+slot.slice(1);if(src==="day"&&to===day)return;

    const d=addDays(cur,to),h=holiday(d);if(h)toast(T().holOnDrop(`${T().days[to]} ${T().md(d)}`,h));
  }

}

/* ---------- events ---------- */
let suppressUntil=0;
document.addEventListener("click",e=>{
  if(Date.now()<suppressUntil)return;
  const t=T(),el=e.target;
  const g=el.closest("[data-g]");
  if(g){if(g.dataset.g==="next"){guide.i++;showGuide()}else endGuide();return}
  if(el.closest("[data-close]")||(el.dataset&&el.dataset.scrim)){closeLayer();return}
  const fb=el.closest(".dial .fb");if(fb){goFace(+fb.dataset.face);return}
  if(el.closest("#knob")){goFace(S.face+1,1);return}
  if(el.closest("#helpBtn")){startGuide();return}
  if(el.closest("#setBtn")){openSettings();return}

  const sb=el.closest("[data-set]");
  if(sb){
    const a=sb.dataset.set;
    if(a==="wallrm"){wall=null;try{localStorage.removeItem(WKEY)}catch(x){}delete S.wallAccent;save();applySkin();openSettings()}
    if(a==="chime"){S.chime=!S.chime;if(S.chime){unlockAudio();chime()}save();sb.setAttribute("aria-pressed",S.chime)}
    if(a==="voice"){S.voice=!S.voice;save();sb.setAttribute("aria-pressed",S.voice)}
    if(a==="test")speak(todayScript());
    if(a==="ics")exportIcs();
    if(a==="notif"){try{Notification.requestPermission().then(()=>openSettings())}catch(x){}}
    if(a==="install"&&installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;openSettings()})}
    return;
  }
  const sw=el.closest(".sw");if(sw){S.skin=sw.dataset.skin;delete S.wallAccent;save();applySkin();render();openSettings();return}

  const gc=el.closest("[data-gcol]");
  if(gc&&redit){redit.color=gc.dataset.gcol;document.querySelectorAll("[data-gcol]").forEach(b=>b.setAttribute("aria-pressed",b===gc));$("rWheels").style.setProperty("--g",redit.color);$("rPrev").style.setProperty("--g",redit.color);return}
  const rg=el.closest("[data-rng]");
  if(rg&&redit){
    if(rg.dataset.rng==="del")S.ranges=S.ranges.filter(x=>x.id!==redit.id);
    else{
      const v={start:redit.start,end:redit.end,color:redit.color,title:$("rTitle").value.trim(),note:$("rNote").value.trim()};
      const r=redit.id&&S.ranges.find(x=>x.id===redit.id);if(r)Object.assign(r,v);else S.ranges.push(Object.assign({id:uid()},v));
    }
    redit=null;save();closeLayer();render();return;
  }
  const gb=el.closest(".gbar[data-rid]");if(gb){openRange({id:gb.dataset.rid});return}
  const pb=el.closest("[data-pop]");
  if(pb){
    const a=pb.dataset.pop,i=+pb.dataset.i;
    if(a==="step"||a==="schedule"){
      const s=S.goal.steps[i];s.text=$("pText").value.trim();s.date=$("pDate").value;s.done=$("pDone").getAttribute("aria-pressed")==="true";save();
      if(a==="schedule"&&!scheduleStep(i,s.date))return;
      closeLayer();render();
    }
    if(a==="goal"){S.goal.title=$("pText").value.trim();save();closeLayer();render()}
    if(a==="song"){
      const url=$("sUrl").value.trim();
      if(!/^https:\/\/\S+$/i.test(url)){$("sErr").hidden=false;return}
      S.songs[i]={title:$("sTitle").value.trim(),artist:$("sArtist")?$("sArtist").value.trim():"",url};save();closeLayer();render();
    }
    if(a==="songrm"){S.songs[i]=null;save();closeLayer();render()}
    return;
  }
  if(el.closest("#pDone")){const b=$("pDone");b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true");return}

  const a=el.closest("[data-act]");
  if(a){
    const act=a.dataset.act;
    if(act==="exask")popText(t.example,t.clearExQ,`<div class="row end"><button class="pill jelly" type="button" data-close="1">${t.keep}</button><button class="pill pri jelly" type="button" data-act="exclear">${t.clear}</button></div>`);
    if(act==="exclear"){S.weeks={};S.example=false;S.goal=seedGoal(LANG[S.region],false);walkerP=0;save();closeLayer();render()}
    if(act==="holinfo")popText(t.holiday,t.holNote[S.region]);
    if(act==="cancel"){pending=null;render()}
    if(act==="join"){
      const p=[OWNER.sponsorPrice.week&&`${t.perWeek} ${OWNER.sponsorPrice.week}`,OWNER.sponsorPrice.month&&`${t.perMonth} ${OWNER.sponsorPrice.month}`].filter(Boolean);
      popText(t.join,t.joinBody,`${p.length?`<div class="row">${p.map(x=>`<span class="hpill" style="color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:transparent;font-size:13px">${esc(x)}</span>`).join("")}</div>`:""}<div class="row end">${OWNER.sponsorContact?`<a class="pill pri jelly" href="${esc(OWNER.sponsorContact)}" target="_blank" rel="noopener">${t.contact}</a>`:`<span class="note">${t.soon}</span>`}</div>`);
    }
    if(act==="soon")toast(t.soon);
    return;
  }
  const tg=el.closest("[data-tag]");
  if(tg){const k=tg.dataset.tag;S.tags=S.tags.includes(k)?S.tags.filter(x=>x!==k):[...S.tags,k];save();render();return}
  const pl=el.closest("[data-plan]");if(pl){S.donatePlan=pl.dataset.plan;save();render();return}
  const ed=el.closest("[data-edit]");if(ed){e.preventDefault();popSong(+ed.dataset.edit);return}
  const st=el.closest("[data-step]");if(st&&S.face===1){popStep(+st.dataset.step);return}
  if(el.closest("[data-goal]")){popGoal();return}

  const md=el.closest("[data-mode]");
  if(md){S.mode=md.dataset.mode;if(S.mode==="month"){const th=addDays(cur,3);curMonth=D(th.getFullYear(),th.getMonth()+1,1)}pending=null;save();render();return}
  if(el.closest("#prevBtn")||el.closest("#nextBtn")){
    const s=el.closest("#prevBtn")?-1:1;
    if(S.mode==="week")cur=addDays(cur,7*s);else curMonth=D(curMonth.getFullYear(),curMonth.getMonth()+1+s,1);
    pending=null;render();return;
  }
  if(el.closest("#nowBtn")){cur=mondayOf(new Date());curMonth=D(new Date().getFullYear(),new Date().getMonth()+1,1);render();return}
  if(el.closest("#readBtn")){speak(todayScript());return}
  const wb=el.closest("[data-week]");if(wb){cur=parse(wb.dataset.week);S.mode="week";save();render();window.scrollTo({top:0});return}
  const pp=el.closest(".pp");if(pp){newPri=pp.dataset.pri;document.querySelectorAll(".pp").forEach(b=>b.setAttribute("aria-pressed",b===pp));$("newTask").focus();return}
  const rb=el.closest("[data-rem]");
  if(rb){
    const q=remQueue.shift(),w=q&&S.weeks[q.wk],x=w&&w.days[q.day].find(y=>y.id===q.id);
    if(x){if(rb.dataset.rem==="done")x.done=true;else{const s=new Date(Date.now()+10*6e4);if(key(s)===key(new Date())){x.time=hm(s);delete x.fired}}}
    if(canSpeak())speechSynthesis.cancel();save();render();showRem(false);return;
  }
  if(el.closest(".tin"))return;
  const c=el.closest(".chip");
  if(c){
    const src=c.dataset.src,id=c.dataset.id,day=c.dataset.day!=null?+c.dataset.day:null;
    const w=W(key(cur)),{list,item}=find(src,id,day);if(!item)return;
    if(el.closest(".x")){if(src==="prev")w.dismissed.push(item.text);else list.splice(list.indexOf(item),1);if(pending&&pending.id===id)pending=null}
    else if(el.closest(".dot")){if(src!=="prev")item.pri=PRI[(PRI.indexOf(item.pri)+1)%3]}
    else if(el.closest(".bell"))editTime=id;
    else if(el.closest(".txt")){if(src==="day")item.done=!item.done;else pending=pending&&pending.id===id?null:{src,id,text:item.text}}
    save();render();return;
  }
  const cell=el.closest(".cell.day");if(cell&&pending)drop(pending.src,pending.id,null,cell.dataset.slot);
});
document.addEventListener("keydown",e=>{
  const node=e.target.closest&&e.target.closest("#nodes .node");
  if(node&&(e.key==="Enter"||e.key===" ")){e.preventDefault();popStep(+node.dataset.step);return}
  if(e.key!=="Escape")return;
  if(guide){endGuide();return}
  if($("layer").innerHTML){closeLayer();return}
  if(editTime){editTime=null;render();return}
  if(pending){pending=null;render()}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="wallFile"){takeWallpaper(el.files&&el.files[0]);el.value="";return}
  if(el.id==="region"){S.region=el.value;save();render();return}
  if(el.classList.contains("tin")){
    const w=W(key(cur)),x=w.days[+el.dataset.day].find(y=>y.id===el.dataset.id);
    if(x){if(el.value)x.time=el.value;else delete x.time;delete x.fired}
    editTime=null;save();render();checkReminders();
  }
});
document.addEventListener("input",e=>{if(e.target.id==="rTitle"&&$("rPrev")){$("rPrev").textContent=e.target.value||T().rUntitled;return}if(e.target.id==="opRange"){S.wallOp=+e.target.value;document.documentElement.style.setProperty("--wall-op",(S.wallOp/100).toFixed(2));save()}});
document.addEventListener("focusout",e=>{if(e.target.classList&&e.target.classList.contains("tin"))setTimeout(()=>{if(editTime&&!document.querySelector(".tin:focus")){editTime=null;render()}},200)});
document.addEventListener("submit",e=>{
  if(e.target.id!=="addForm")return;e.preventDefault();
  const v=$("newTask").value.trim();if(!v)return;
  W(key(cur)).inbox.push({id:uid(),text:v,pri:newPri});$("newTask").value="";save();render();$("newTask").focus();
});

/* ---------- drag (tasks) and swipe (faces) with pointer events ---------- */
let drag=null,swipe=null;
document.addEventListener("pointerdown",e=>{
  if(S.face===0&&S.mode==="month"&&e.button===0&&!rp){
    const bar=e.target.closest("#mgrid .gbar"),day=e.target.closest("#mgrid .mday");
    if(bar||day){
      const anchor=bar?dateAt(e.clientX,e.clientY):day.dataset.date;
      if(anchor){rp={mode:"wait",type:e.pointerType,x:e.clientX,y:e.clientY,anchor,rid:bar?bar.dataset.rid:null};rp.timer=setTimeout(rangeActivate,e.pointerType==="mouse"?240:330)}
      return;
    }
  }
  const c=e.target.closest(".chip");
  if(c&&e.button===0&&!e.target.closest(".x,.dot,.bell,.tin")&&(e.pointerType==="mouse"||e.target.closest(".grip"))){drag={c,x:e.clientX,y:e.clientY,on:false};return}
  if(e.pointerType!=="mouse"&&e.target.closest("#stage")&&!e.target.closest(".chip,input,.grip"))swipe={x:e.clientX,y:e.clientY,t:Date.now()};
});
addEventListener("pointermove",e=>{
  if(rangeMove(e))return;
  if(!drag)return;
  if(!drag.on){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
    drag.on=true;const r=drag.c.getBoundingClientRect();
    drag.dx=drag.x-r.left;drag.dy=drag.y-r.top;
    drag.g=drag.c.cloneNode(true);drag.g.classList.add("ghost");drag.g.style.width=r.width+"px";
    document.body.appendChild(drag.g);drag.c.classList.add("dragging");document.body.classList.add("is-dragging");
    if(guide&&S.face===0)endGuide();
  }
  e.preventDefault();
  drag.g.style.transform=`translate(${e.clientX-drag.dx}px,${e.clientY-drag.dy}px) rotate(-2deg) scale(1.04)`;
  const el=document.elementFromPoint(e.clientX,e.clientY),cell=el&&el.closest(".cell");
  document.querySelectorAll(".cell.over").forEach(x=>{if(x!==cell)x.classList.remove("over")});
  if(cell&&cell.dataset.slot!=="prev")cell.classList.add("over");
},{passive:false});
function endDrag(e,commit){
  if(rangeEnd(e,commit))return;
  if(swipe&&commit){
    const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;
    if(Math.abs(dx)>70&&Math.abs(dy)<60&&Date.now()-swipe.t<700){suppressUntil=Date.now()+350;goFace(S.face+(dx<0?1:-1),dx<0?1:-1)}
  }
  swipe=null;
  if(!drag)return;const d=drag;drag=null;if(!d.on)return;
  d.g.remove();d.c.classList.remove("dragging");document.body.classList.remove("is-dragging");
  document.querySelectorAll(".cell.over").forEach(x=>x.classList.remove("over"));
  suppressUntil=Date.now()+350;
  if(!commit)return;
  const el=document.elementFromPoint(e.clientX,e.clientY),cell=el&&el.closest(".cell");
  if(cell)drop(d.c.dataset.src,d.c.dataset.id,d.c.dataset.day!=null?+d.c.dataset.day:null,cell.dataset.slot);
}
addEventListener("pointerup",e=>endDrag(e,true));
addEventListener("pointercancel",e=>endDrag(e,false));
if(canSpeak()){try{speechSynthesis.getVoices()}catch(e){}}

applySkin();
render();
checkReminders();
maybeGuide();
})();
</script>

</body>
</html>
