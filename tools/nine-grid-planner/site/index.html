<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="九宮格週計畫：把一週的待辦放進九個格子，含國定假日提醒、語音提醒與自訂桌布。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="九宮格">
<script>window.NG_SITE=true;window.NG_SITE_URL="";</script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>九宮格週計畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#FFFFFF;
  --paper:#F5F6F9;
  --ink:#1E2230;
  --muted:#6A7082;
  --line:#E3E6EC;
  --grid:#C5CAD6;
  --accent:#2A57C0;
  --accent-soft:#E8EEFB;
  --on-accent:#FFFFFF;
  --hi:#D6453D;
  --mid:#E0A019;
  --low:#B3B8C4;
  --hol:#C0372F;
  --hol-soft:#FCEDEB;
  --chip:#FFFFFF;
  --op:86%;
  --shadow:0 6px 20px rgba(30,34,48,.14);
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Hiragino Sans",serif;
  --f-body:"Noto Sans TC","PingFang TC","Hiragino Sans","Noto Sans JP","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#13151B;--paper:#1A1D25;--ink:#E7E9EF;--muted:#9197A8;--line:#2A2F3A;--grid:#3A404D;
    --accent:#86A7F2;--accent-soft:#1F2A44;--on-accent:#10131A;--hi:#F06C64;--mid:#F0BE4A;--low:#737A8A;
    --hol:#F08A82;--hol-soft:#35201F;--chip:#1F232C;--shadow:0 6px 20px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#13151B;--paper:#1A1D25;--ink:#E7E9EF;--muted:#9197A8;--line:#2A2F3A;--grid:#3A404D;
  --accent:#86A7F2;--accent-soft:#1F2A44;--on-accent:#10131A;--hi:#F06C64;--mid:#F0BE4A;--low:#737A8A;
  --hol:#F08A82;--hol-soft:#35201F;--chip:#1F232C;--shadow:0 6px 20px rgba(0,0,0,.5);
}
/* skins: set on body, so they win over the light/dark theme */
body[data-skin="sakura"]{color-scheme:light;--bg:#FFF8F9;--paper:#FCECEF;--ink:#2B1F24;--muted:#7C636A;--line:#F2DCE1;--grid:#E9C2CB;--accent:#C2456B;--accent-soft:#FBE3EA;--on-accent:#FFFFFF;--chip:#FFFFFF;--hi:#D6453D;--mid:#D99A16;--low:#C1B3B7;--hol:#B8342C;--hol-soft:#FDE9E7}
body[data-skin="matcha"]{color-scheme:light;--bg:#F7F9F2;--paper:#EBF1E0;--ink:#1F2618;--muted:#65705A;--line:#DDE5CC;--grid:#C2D0A8;--accent:#4B7A2B;--accent-soft:#E2EDD3;--on-accent:#FFFFFF;--chip:#FFFFFF;--hi:#D6453D;--mid:#D99A16;--low:#B5BCA9;--hol:#B8342C;--hol-soft:#FBEAE6}
body[data-skin="ocean"]{color-scheme:light;--bg:#F4F9FC;--paper:#E3EFF6;--ink:#14232C;--muted:#5A7180;--line:#D4E4ED;--grid:#B3CDDC;--accent:#1B6D96;--accent-soft:#DAEAF3;--on-accent:#FFFFFF;--chip:#FFFFFF;--hi:#D6453D;--mid:#D99A16;--low:#AFBDC6;--hol:#B8342C;--hol-soft:#FBEAE8}
body[data-skin="night"]{color-scheme:dark;--bg:#12141F;--paper:#1A1D2C;--ink:#E9EAF2;--muted:#9296AD;--line:#2A2E42;--grid:#393E57;--accent:#F2C66D;--accent-soft:#3A3322;--on-accent:#171717;--chip:#1E2233;--hi:#F06C64;--mid:#F2C14E;--low:#767B93;--hol:#F59189;--hol-soft:#3A2224;--shadow:0 6px 20px rgba(0,0,0,.5)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
#wall{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;pointer-events:none}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;text-wrap:balance}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.04em}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sel{appearance:none;border:1px solid var(--line);background-color:var(--bg);color:var(--ink);font:inherit;font-size:13px;border-radius:8px;padding:7px 28px 7px 10px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.toggle,.ibtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;background:var(--bg)}
.ibtn{border-color:var(--line)}
.toggle:hover{background:var(--ink);color:var(--bg)}
.ibtn:hover,.ibtn[aria-expanded="true"]{border-color:var(--ink)}
.toggle svg,.ibtn svg{width:16px;height:16px;flex:none}

/* nav */
.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.arrow{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:16px;background:var(--bg)}
.arrow:hover{border-color:var(--ink)}
.navlabel{display:flex;flex-direction:column;min-width:0}
.navlabel b{font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.2}
.navlabel span{font-size:12px;color:var(--muted);font-family:var(--f-num);letter-spacing:.02em}
.navright{margin-left:auto;display:flex;gap:8px;align-items:center}
.now,.speak{font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:4px 12px;background:var(--bg);display:inline-flex;align-items:center;gap:5px}
.speak svg{width:14px;height:14px}

/* settings sheet */
.sheet{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px 22px}
.sheet h2{font-family:var(--f-display);font-size:16px;margin:0 0 8px}
.sheet section{display:flex;flex-direction:column;gap:10px;min-width:0}
.sheet p{margin:0;font-size:12px;color:var(--muted);line-height:1.55}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);width:54px}
.sw b{width:44px;height:44px;border-radius:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:0;overflow:hidden;border:2px solid transparent;background:var(--g)}
.sw b i{background:var(--c)}
.sw b i:nth-child(5){background:var(--p)}
.sw[aria-pressed="true"]{color:var(--ink);font-weight:700}
.sw[aria-pressed="true"] b{border-color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.row input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.upload{position:relative;overflow:hidden}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.status{font-size:12px;color:var(--accent)}

/* notices */
.notice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;border-radius:10px;padding:9px 12px}
.notice.hol{background:var(--hol-soft);color:var(--hol)}
.notice.hol .hl{display:flex;flex-wrap:wrap;gap:4px 12px}
.notice.hol .hl span{white-space:nowrap}
.notice.hol .hl em{font-style:normal;font-family:var(--f-num);font-size:12px;margin-right:4px}
.notice.plain{background:var(--paper);color:var(--muted)}
.notice.ex{background:var(--accent-soft);color:var(--ink)}
.notice .acts{display:flex;gap:8px;margin-left:auto}
.btn{border-radius:8px;padding:5px 11px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.btn svg{width:14px;height:14px;flex:none}
.btn{white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.placing{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 12px;font-size:13px}
.placing .btn{margin-left:auto;background:transparent;color:var(--bg);border-color:currentColor}

/* nine grid: lines only between cells, like a tic-tac-toe board */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:var(--grid)}
.cell{background:var(--bg);min-height:176px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:background .12s}
.cell.center{background:var(--paper)}
.cell.prev{background:repeating-linear-gradient(135deg,var(--bg) 0 9px,var(--paper) 9px 10px)}
.cell.over{background:var(--accent-soft)}
.cell.day.pickable{cursor:copy}
.cell.day.pickable:hover{background:var(--accent-soft)}
.ch{display:flex;align-items:baseline;gap:6px;min-width:0}
.dn{font-family:var(--f-display);font-weight:700;font-size:16px}
.dd{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.cnt{margin-left:auto;font-family:var(--f-num);font-size:11px;color:var(--muted)}
.cell.today .dn{color:var(--accent)}
.cell.today .dd{background:var(--accent);color:var(--on-accent);border-radius:4px;padding:0 5px}
.cell.hol .dd{color:var(--hol)}
.cell.today.hol .dd{color:var(--on-accent)}
.htag{align-self:flex-start;font-size:11px;line-height:1.35;color:var(--hol);background:var(--hol-soft);border-radius:4px;padding:1px 6px;max-width:100%}
.ctitle{font-family:var(--f-display);font-weight:700;font-size:16px}
.cell.prev .ctitle{color:var(--muted)}
.hint{font-size:12px;color:var(--muted);line-height:1.45;margin:0}

/* wallpaper mode: glass panels so text stays readable over any photo */
body.has-wall .grid{background:color-mix(in srgb,var(--grid) 75%,transparent)}
body.has-wall .cell,body.has-wall .cell.prev{background:color-mix(in srgb,var(--bg) var(--op),transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
body.has-wall .cell.center{background:color-mix(in srgb,var(--paper) var(--op),transparent)}
body.has-wall .cell.over,body.has-wall .cell.day.pickable:hover{background:color-mix(in srgb,var(--accent-soft) 92%,transparent)}
body.has-wall .glass{background:color-mix(in srgb,var(--bg) var(--op),transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:12px;padding:10px 12px}

.add{display:flex;flex-direction:column;gap:6px}
.add input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 9px;font:inherit;font-size:16px}
.add input::placeholder{color:var(--muted)}
.addrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pp{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 8px 3px 6px;font-size:12px;background:var(--bg)}
.pp i{width:9px;height:9px;border-radius:50%;display:block;background:var(--c)}
.pp[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.addbtn{margin-left:auto;width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:18px;line-height:1;display:grid;place-items:center}

/* task chips */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.chip{display:flex;align-items:flex-start;gap:5px;background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:4px 4px 4px 6px;font-size:13px;line-height:1.4;user-select:none;-webkit-user-select:none;cursor:grab}
.cell.center .chip{background:var(--bg)}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.chip.dragging{opacity:.35}
.chip.ring{animation:ring 1s ease-in-out 3}
@keyframes ring{50%{box-shadow:0 0 0 4px var(--accent-soft);border-color:var(--accent)}}
.grip{display:none;flex:none;width:14px;align-self:stretch;touch-action:none;cursor:grab;
  background:radial-gradient(circle,var(--muted) 1.1px,transparent 1.3px) 0 0/5px 5px;opacity:.7;margin:2px 0}
.dot{flex:none;width:18px;height:19px;display:grid;place-items:center}
.dot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.p-high{--c:var(--hi)}.p-mid{--c:var(--mid)}.p-low{--c:var(--low)}
.chip.p-high{border-left:3px solid var(--hi)}
.txt{flex:1;min-width:0;text-align:left;overflow-wrap:anywhere}
.chip.done .txt{text-decoration:line-through;color:var(--muted)}
.chip.done .dot::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.badge{flex:none;font-size:10px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 4px;margin-top:1px;white-space:nowrap}
.bell{flex:none;height:19px;min-width:18px;display:inline-flex;align-items:center;justify-content:center;gap:2px;color:var(--muted);opacity:0;font-family:var(--f-num);font-size:11px}
.bell svg{width:13px;height:13px}
.bell.on{opacity:1;color:var(--accent);font-weight:500}
.tin{flex:none;width:92px;font:inherit;font-size:12px;border:1px solid var(--accent);border-radius:5px;padding:0 3px;background:var(--bg);color:var(--ink)}
.x{flex:none;width:20px;height:19px;color:var(--muted);font-size:15px;line-height:1;opacity:0}
.chip:hover .x,.chip:focus-within .x,.chip:hover .bell,.chip:focus-within .bell{opacity:1}
.x:hover{color:var(--hi)}
@media (pointer:coarse){
  .grip{display:block}
  .x{opacity:.8}.bell{opacity:.8}
  .chip{cursor:default}
}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;box-shadow:var(--shadow);transform-origin:0 0;opacity:.95}
body.is-dragging{cursor:grabbing}
.tour-on{outline:3px solid var(--accent)!important;outline-offset:-3px;position:relative;z-index:2}

/* month view */
.month{overflow-x:auto;display:flex;flex-direction:column;gap:12px}
.mgrid{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));gap:2px;background:var(--grid)}
.mgrid>*{background:var(--bg)}
body.has-wall .mgrid>*{background:color-mix(in srgb,var(--bg) var(--op),transparent)}
body.has-wall .mgrid{background:color-mix(in srgb,var(--grid) 75%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mh{font-size:12px;color:var(--muted);text-align:center;padding:6px 0;font-weight:500}
.mh.we{color:var(--hol)}
.wk{font-family:var(--f-num);font-size:11px;color:var(--muted);display:flex;align-items:flex-start;justify-content:center;padding-top:8px}
.wk:hover{color:var(--accent);background:var(--accent-soft)}
.mday{min-height:92px;padding:6px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;min-width:0}
.mday:hover{background:var(--accent-soft)}
.mday .num{font-family:var(--f-num);font-size:13px}
.mday.out{background:var(--paper)}
.mday.out .num{color:var(--muted);opacity:.6}
.mday.hol .num{color:var(--hol)}
.mday.today .num{background:var(--accent);color:var(--on-accent);border-radius:4px;padding:0 5px}
.mday .hn{font-size:11px;line-height:1.3;color:var(--hol);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.bars{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.bars i{width:8px;height:8px;border-radius:50%;background:var(--c);display:block}
.bars i.d{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.bars b{font-family:var(--f-num);font-size:10px;font-weight:500;color:var(--muted);line-height:8px}
.mlist{display:flex;flex-direction:column;gap:4px;font-size:13px}
.mlist h2{font-family:var(--f-display);font-size:16px;margin:0 0 2px}
.mlist div{display:flex;gap:10px}
.mlist em{font-style:normal;font-family:var(--f-num);font-size:12px;color:var(--hol);min-width:74px}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c);display:block}
.foot{font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:12px}
.foot p{margin:0 0 4px}
body.has-wall .foot{border-top:0}

.float{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;border-radius:12px;padding:11px 14px;width:max-content;max-width:calc(100% - 32px);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.float .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 45%,transparent)}
.float .btn.pri{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.float .acts{display:flex;gap:6px;margin-left:auto}
#rem{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
#rem b{font-weight:700}
.tourbar{flex-direction:column;align-items:stretch;max-width:min(440px,calc(100% - 32px))}
.tourbar small{opacity:.7;font-family:var(--f-num)}

@media (max-width:600px){
  .brand{font-size:19px}
  .cell{min-height:150px;padding:7px 6px 9px;gap:5px}
  .dn,.ctitle{font-size:14px}
  .dd{font-size:11px}
  .cnt{display:none}
  .chip{font-size:12px;padding:3px 2px 3px 3px;gap:2px;flex-wrap:wrap}
  .dot{width:14px}
  .x{width:16px}
  .badge{display:none}
  .bell{min-width:14px}
  .bell.on{order:-1;flex-basis:100%;justify-content:flex-start;padding-left:17px;height:15px}
  .bell svg{width:12px;height:12px}
  .pp{padding:2px 6px 2px 4px;font-size:11px}
  .pp .pl{display:none}
  .mday{min-height:70px;padding:4px 3px}
  .mday .hn{font-size:10px}
  .mgrid{grid-template-columns:26px repeat(7,minmax(0,1fr))}
  .mlist em{min-width:60px}
  .ibtn span,.toggle span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="wall"></div>
<div class="wrap">
  <div class="top glass">
    <h1 class="brand" id="brand">九宮格週計畫<small id="tagline"></small></h1>
    <div class="tools">
      <select id="region" class="sel" aria-label="Region">
        <option value="TW">台灣・繁中</option>
        <option value="JP">日本・日本語</option>
        <option value="US">United States</option>
        <option value="GB">United Kingdom</option>
      </select>
      <button id="setBtn" class="ibtn" type="button" aria-expanded="false" aria-controls="sheet"></button>
      <button id="viewToggle" class="toggle" type="button"></button>
    </div>
  </div>

  <div class="sheet" id="sheet" hidden></div>

  <div class="nav glass">
    <button class="arrow" id="prevBtn" type="button" aria-label="Previous">‹</button>
    <div class="navlabel"><b id="navMain"></b><span id="navSub"></span></div>
    <button class="arrow" id="nextBtn" type="button" aria-label="Next">›</button>
    <div class="navright">

const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const LANG={TW:"zh",JP:"ja",US:"en",GB:"en"};
const VOICE_LANG={TW:"zh-TW",JP:"ja-JP",US:"en-US",GB:"en-GB"};
function spokenTime(t,l){
  const [h,m]=t.split(":").map(Number);
  if(l==="zh")return `${h<12?"上午":h<18?"下午":"晚上"}${h%12===0?12:h%12}點${m?(m===30?"半":m+"分"):""}`;
  if(l==="ja")return `${h<12?"午前":"午後"}${h%12===0?12:h%12}時${m?(m===30?"半":m+"分"):""}`;
  return `${h%12===0?12:h%12}${m?":"+String(m).padStart(2,"0"):" o'clock"} ${h<12?"a.m.":"p.m."}`;
}

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const D=(y,m,d)=>new Date(y,m-1,d);
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return D(y,m,d)};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
function isoWeek(d){const t=addDays(d,3-((d.getDay()+6)%7));const y=t.getFullYear();const f=D(y,1,4);return {y,w:1+Math.round(((t-f)/864e5-3+((f.getDay()+6)%7))/7)}}
function nth(y,m,wd,n){
  if(n>0){const f=D(y,m,1);return D(y,m,1+((wd-f.getDay()+7)%7)+7*(n-1))}
  const l=D(y,m+1,0);return D(y,m,l.getDate()-((l.getDay()-wd+7)%7));
}

/* ---------- public holidays (computed from each country's rules) ---------- */
function put(m,d,name){const k=key(d);m[k]=m[k]?m[k]+"・"+name:name}
const has=(m,d)=>!!m[key(d)];

// Lunar-calendar dates Taiwan needs (Lunar New Year day 1, Dragon Boat, Mid-Autumn) and the Qingming solar term.
const LUNAR={
  2024:{lny:"2024-02-10",db:"2024-06-10",ma:"2024-09-17",qm:"2024-04-04"},
  2025:{lny:"2025-01-29",db:"2025-05-31",ma:"2025-10-06",qm:"2025-04-04"},
  2026:{lny:"2026-02-17",db:"2026-06-19",ma:"2026-09-25",qm:"2026-04-05"},
  2027:{lny:"2027-02-06",db:"2027-06-09",ma:"2027-09-15",qm:"2027-04-05"},
  2028:{lny:"2028-01-26",db:"2028-05-28",ma:"2028-10-03",qm:"2028-04-04"},
  2029:{lny:"2029-02-13",db:"2029-06-16",ma:"2029-09-22",qm:"2029-04-04"},
  2030:{lny:"2030-02-03",db:"2030-06-05",ma:"2030-09-12",qm:"2030-04-05"}
};
function TW(y,m){
  const L=LUNAR[y];const singles=[];
  const one=(d,n)=>{put(m,d,n);singles.push(d)};
  one(D(y,1,1),"開國紀念日");one(D(y,2,28),"和平紀念日");one(D(y,5,1),"勞動節");one(D(y,10,10),"國慶日");
  if(y>=2025){one(D(y,9,28),"教師節");one(D(y,10,25),"臺灣光復節");one(D(y,12,25),"行憲紀念日")}
  if(L){
    const qm=parse(L.qm);
    if(qm.getMonth()===3&&qm.getDate()===4){
      put(m,qm,"兒童節・清明節");
      // Same day: Children's Day moves to the day before, or the day after when that is a Thursday.
      put(m,addDays(qm,qm.getDay()===4?1:-1),"兒童節補假");
    }else{one(D(y,4,4),"兒童節");one(qm,"清明節")}

function renderSheet(){
  const el=$("sheet"),t=T();el.hidden=!sheetOpen;if(!sheetOpen)return;
  const perm="Notification" in window?Notification.permission:"unsupported";
  const notif=perm==="granted"?`<span class="status">${t.notifOn}</span>`:(perm==="default"&&IS_SITE)?`<button class="btn" type="button" data-set="notif">${ICON_BELL}${t.notifAsk}</button>`:`<p>${esc(t.notifNo)}</p>`;
  let inst="";
  if(IS_SITE){
    inst=standalone()?`<p class="status">${t.installed}</p>`:(installEvt?`<button class="btn pri" type="button" data-set="install">${t.installBtn}</button>`:"");
  }else{
    inst=`<p>${esc(t.installPreview)}</p>`+(SITE_URL?`<p><a href="${esc(SITE_URL)}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:500;word-break:break-all">${esc(SITE_URL)}</a></p>`:`<p><b>${esc(t.installNoSite)}</b></p>`);
  }
  el.innerHTML=`
<section><h2>${t.look}</h2>
<div class="swatches" role="group" aria-label="${t.look}">${Object.keys(SKINS).map(k=>{const [bg,p,g]=SKINS[k];return `<button type="button" class="sw" data-skin="${k}" aria-pressed="${S.skin===k}"><b style="--g:${g};--c:${bg};--p:${p}">${"<i></i>".repeat(9)}</b>${t.skins[k]}</button>`}).join("")}</div>
<div class="row"><label class="btn upload">${wall?t.wallChange:t.upload}<input id="wallFile" type="file" accept="image/*"></label>${wall?`<button class="btn" type="button" data-set="wallrm">${t.wallRemove}</button>`:""}</div>
${wall?`<div class="row"><label for="opRange">${t.opacity}</label><input id="opRange" type="range" min="55" max="100" step="1" value="${S.op}"></div>`:""}
<p>${esc(t.wallHelp)}</p>${sheetMsg?`<p class="status">${esc(sheetMsg)}</p>`:""}
</section>
<section><h2>${t.remind}</h2>
<p>${esc(t.remHelp)}</p>
<label class="switch"><input id="chimeSw" type="checkbox"${S.chime?" checked":""}>${t.chimeOn}</label>
${canSpeak()?`<label class="switch"><input id="voiceSw" type="checkbox"${S.voice?" checked":""}>${t.voiceOn}</label>
<div class="row"><button class="btn" type="button" data-set="test">${ICON_SPEAK}${t.testVoice}</button><button class="btn" type="button" data-set="tour">${t.tour}</button></div>`:`<p>${esc(t.noVoice)}</p>`}
<div class="row"><b style="font-size:12px">${t.notif}</b></div>${notif}
${IS_SITE?`<p>${esc(t.icsHelp)}</p><div class="row"><button class="btn" type="button" data-set="ics">${ICON_CAL}${t.ics}</button></div>`:""}
</section>
<section><h2>${t.install}</h2>${inst}<p>${esc(t.iosHow)}</p><p>${esc(t.andHow)}</p><p>${esc(t.pcHow)}</p></section>`;
}

function chip(it,src,day,extra){
  const t=T();
  const bell=src==="day"?(editTime===it.id?`<input class="tin" type="time" value="${it.time||""}" aria-label="${t.bell}" data-id="${it.id}" data-day="${day}">`:`<button class="bell${it.time?" on":""}" type="button" aria-label="${t.bell}">${it.time?esc(it.time):ICON_BELL}</button>`):"";
  return `<li class="chip p-${it.pri}${it.done?" done":""}${pending&&pending.src===src&&pending.id===it.id?" sel":""}" data-src="${src}" data-id="${it.id}"${day!=null?` data-day="${day}"`:""}>
<span class="grip" title="${t.grip}"></span><button class="dot" type="button" aria-label="${t.cycle}: ${t.pri[it.pri]}"${src==="prev"?" disabled":""}></button><button class="txt" type="button">${esc(it.text)}</button>${extra||""}${bell}<button class="x" type="button" aria-label="${t.del}">×</button></li>`;
}

function exampleNotice(t){return S.example?`<div class="notice ex"><span>${esc(t.exNote)}</span><span class="acts"><button class="btn" type="button" data-act="exkeep">${t.exKeep}</button><button class="btn pri" type="button" data-act="exclear">${t.exClear}</button></span></div>`:""}

function renderWeek(){
  const t=T(),k=key(cur),w=W(k),sun=addDays(cur,6),today=key(new Date());
  $("navMain").textContent=t.range(cur,sun);
  const iw=isoWeek(cur);$("navSub").textContent=t.wno(iw.y,iw.w);
  $("nowBtn").textContent=t.thisWeek;$("nowBtn").hidden=k===key(mondayOf(new Date()));

  let nt=exampleNotice(t);
  const hs=[];for(let i=0;i<7;i++){const d=addDays(cur,i),h=holiday(d);if(h)hs.push(`<span><em>${esc(t.md(d))} ${t.short[i]}</em>${esc(h)}</span>`)}
  nt+=hs.length?`<div class="notice hol"><b>${t.holWeek}</b><span class="hl">${hs.join("")}</span></div>`:`<div class="notice plain">${t.noHol}</div>`;
  if(pending)nt+=`<div class="placing"><span>${esc(t.placing(pending.text))}</span><button class="btn" type="button" data-act="cancel">${t.cancel}</button></div>`;
  $("notices").innerHTML=nt;

  // left over from last week: undone tasks, minus ones already brought into this week or dismissed
  const pw=S.weeks[key(addDays(cur,-7))];
  const here=new Set([...w.inbox,...w.days.flat()].map(x=>x.text));
  const seen=new Set();prevItems=[];
  if(pw){for(const it of [...pw.days.flat(),...pw.inbox.filter(x=>!pw.days.flat().some(y=>y.src===x.id))]){
    if(it.done||seen.has(it.text)||here.has(it.text)||w.dismissed.includes(it.text))continue;
    seen.add(it.text);prevItems.push({id:"p"+prevItems.length,text:it.text,pri:it.pri})}}

  const placed={};for(let i=0;i<7;i++)for(const x of w.days[i])if(x.src)(placed[x.src]=placed[x.src]||[]).push(i);

  const cell=i=>{
    const d=addDays(cur,i),h=holiday(d),items=byDay(w.days[i]),done=items.filter(x=>x.done).length;
    return `<section class="cell day${key(d)===today?" today":""}${h?" hol":""}${pending?" pickable":""}" data-slot="d${i}" aria-label="${t.days[i]} ${esc(t.md(d))}">
<div class="ch"><span class="dn">${t.days[i]}</span><span class="dd">${esc(t.md(d))}</span>${items.length?`<span class="cnt">${done}/${items.length}</span>`:""}</div>
${h?`<div class="htag">${esc(h)}</div>`:""}<ul class="list">${items.map(x=>chip(x,"day",i)).join("")}</ul></section>`;
  };
  const center=`<section class="cell center" data-slot="inbox">
<div class="ctitle">${t.inbox}</div>
<form class="add" id="addForm" autocomplete="off"><input id="newTask" type="text" maxlength="80" placeholder="${esc(t.placeholder)}" aria-label="${esc(t.placeholder)}">
<div class="addrow">${PRI.map(p=>`<button type="button" class="pp p-${p}" data-pri="${p}" aria-pressed="${p===newPri}"><i></i><span class="pl">${t.pri[p]}</span></button>`).join("")}
<button class="addbtn" type="submit" aria-label="${t.add}">+</button></div></form>
${w.inbox.length?`<ul class="list">${byPri(w.inbox).map(x=>chip(x,"inbox",null,placed[x.id]?`<span class="badge">${[...new Set(placed[x.id])].sort().map(i=>t.short[i]).join(" ")}</span>`:"")).join("")}</ul>`:`<p class="hint">${esc(t.inboxEmpty)}</p>`}
</section>`;
  const prev=`<section class="cell prev" data-slot="prev"><div class="ctitle">${t.prev}</div>
${prevItems.length?`<ul class="list">${byPri(prevItems).map(x=>chip(x,"prev")).join("")}</ul>`:`<p class="hint">${esc(t.prevEmpty)}</p>`}</section>`;

  const keepFocus=document.activeElement&&document.activeElement.id==="newTask";
  const draft=$("newTask")?$("newTask").value:"";
  $("view").innerHTML=`<div class="grid" id="grid">${cell(0)}${cell(1)}${cell(2)}${cell(3)}${center}${cell(4)}${cell(5)}${cell(6)}${prev}</div>`;
  $("newTask").value=draft;if(keepFocus)$("newTask").focus();
  const tin=document.querySelector(".tin");if(tin){tin.focus();try{tin.showPicker&&tin.showPicker()}catch(e){}}
}

function renderMonth(){
  const t=T(),y=curMonth.getFullYear(),mo=curMonth.getMonth(),today=key(new Date());
  $("navMain").textContent=t.month(y,mo);$("navSub").textContent="";
  $("nowBtn").textContent=t.thisMonth;
  const n=new Date();$("nowBtn").hidden=n.getFullYear()===y&&n.getMonth()===mo;
  $("notices").innerHTML=exampleNotice(t);
  const first=D(y,mo+1,1),last=D(y,mo+2,0);
  let h=`<div class="mgrid"><div class="mh"></div>${t.short.map((s,i)=>`<div class="mh${i>4?" we":""}">${s}</div>`).join("")}`;
  const hols=[];let row=1;
  for(let m=mondayOf(first);m<=last;m=addDays(m,7),row++){
    const w=S.weeks[key(m)];
    h+=`<button class="wk" type="button" data-week="${key(m)}" aria-label="W${row}">W${row}</button>`;
    for(let i=0;i<7;i++){
      const d=addDays(m,i),out=d.getMonth()!==mo,hol=holiday(d),items=w?byDay(w.days[i]):[];
      if(hol&&!out)hols.push([d,hol,i]);
      const bars=items.slice(0,5).map(x=>`<i class="p-${x.pri}${x.done?" d":""}"></i>`).join("")+(items.length>5?`<b>+${items.length-5}</b>`:"");
      h+=`<button class="mday${out?" out":""}${hol?" hol":""}${key(d)===today?" today":""}" type="button" data-week="${key(m)}"><span class="num">${d.getDate()}</span>${hol?`<span class="hn">${esc(hol)}</span>`:""}<span class="bars">${bars}</span></button>`;
    }
  }
  h+="</div>";
  h+=`<div class="mlist glass"><h2>${t.monthHol}</h2>${hols.length?hols.map(([d,n,i])=>`<div><em>${esc(t.md(d))} ${t.short[i]}</em><span>${esc(n)}</span></div>`).join(""):`<div>${t.monthNone}</div>`}</div>`;
  $("view").innerHTML=`<div class="month">${h}</div>`;
}

/* ---------- voice tour ---------- */
let tourStep=-1;
function tourShow(){
  document.querySelectorAll(".tour-on").forEach(x=>x.classList.remove("tour-on"));
  const t=T(),el=$("tour");
  if(tourStep<0||tourStep>=t.tourSteps.length){tourStep=-1;el.hidden=true;if(canSpeak())speechSynthesis.cancel();return}
  const [sel,text]=t.tourSteps[tourStep];
  const target=document.querySelector(sel.split(",")[0])||document.querySelector(sel.split(",")[1]);
  if(target){target.classList.add("tour-on");target.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
  const lastStep=tourStep===t.tourSteps.length-1;
  el.innerHTML=`<small>${tourStep+1} / ${t.tourSteps.length}</small><span>${esc(text)}</span><span class="acts"><button class="btn" type="button" data-tour="end">${t.tourEnd}</button>${lastStep?"":`<button class="btn pri" type="button" data-tour="next">${t.tourNext}</button>`}</span>`;
  el.hidden=false;
  speak(text);
}
function tourStart(){
  sheetOpen=false;if(S.view!=="week"){S.view="week"}
  cur=mondayOf(new Date());render();tourStep=0;tourShow();
}

/* ---------- actions ---------- */
function find(src,id,day){
  const w=W(key(cur));
  if(src==="inbox")return {list:w.inbox,item:w.inbox.find(x=>x.id===id)};
  if(src==="day")return {list:w.days[day],item:w.days[day].find(x=>x.id===id)};
  return {list:null,item:prevItems.find(x=>x.id===id)};
}
let toastTimer;
function toast(msg){const el=$("toast");el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3600)}

function drop(src,id,day,slot){
  const w=W(key(cur)),{list,item}=find(src,id,day);if(!item)return;
  if(slot==="prev")return;
  if(slot==="inbox"){
    if(src==="day"){list.splice(list.indexOf(item),1);w.inbox.push({id:uid(),text:item.text,pri:item.pri})}
    else if(src==="prev")w.inbox.push({id:uid(),text:item.text,pri:item.pri});
    else return;
  }else{
    const to=+slot.slice(1);if(src==="day"&&to===day)return;
    if(src==="day"){list.splice(list.indexOf(item),1);delete item.fired;w.days[to].push(item)}
    else w.days[to].push({id:uid(),text:item.text,pri:item.pri,done:false,src:src==="inbox"?item.id:undefined});
    const d=addDays(cur,to),h=holiday(d);
    if(h)toast(T().holOnDrop(`${T().days[to]} ${T().md(d)}`,h));
  }
  pending=null;save();render();
}

document.addEventListener("click",e=>{
  if(Date.now()<suppressUntil)return;
  const t=T();
  const a=e.target.closest("[data-act]");
  if(a){
    const act=a.dataset.act;
    if(act==="exclear"){S.weeks={};S.example=false}
    if(act==="exkeep")S.example=false;
    if(act==="cancel")pending=null;
    save();render();return;
  }
  const tb=e.target.closest("[data-tour]");
  if(tb){if(tb.dataset.tour==="next")tourStep++;else tourStep=-1;tourShow();return}
  const rb=e.target.closest("[data-rem]");
  if(rb){
    const q=remQueue.shift();const w=q&&S.weeks[q.wk];const x=w&&w.days[q.day].find(y=>y.id===q.id);
    if(x){
      if(rb.dataset.rem==="done")x.done=true;
      else{const s=new Date(Date.now()+10*6e4);if(key(s)===key(new Date())){x.time=hm(s);delete x.fired}}
    }
    if(canSpeak())speechSynthesis.cancel();
    save();render();showRem(false);return;
  }
  const sb=e.target.closest("[data-set]");
  if(sb){
    const act=sb.dataset.set;
    if(act==="wallrm"){wall=null;try{localStorage.removeItem(WKEY)}catch(e){}delete S.wallAccent;sheetMsg="";save();applySkin();renderSheet()}
    if(act==="test")speak(todayScript());
    if(act==="tour")tourStart();
    if(act==="ics")exportIcs();
    if(act==="notif"){try{Notification.requestPermission().then(()=>renderSheet())}catch(e){}}
    if(act==="install"&&installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;renderSheet()})}
    return;
  }
  const sw=e.target.closest(".sw");
  if(sw){S.skin=sw.dataset.skin;if(wall&&S.wallAccent)delete S.wallAccent;save();applySkin();renderSheet();return}
  if(e.target.closest("#setBtn")){sheetOpen=!sheetOpen;sheetMsg="";$("setBtn").setAttribute("aria-expanded",sheetOpen);renderSheet();return}
  if(e.target.closest("#readBtn")){speak(todayScript());return}
  if(e.target.closest("#viewToggle")){
    if(S.view==="week"){S.view="month";const th=addDays(cur,3);curMonth=D(th.getFullYear(),th.getMonth()+1,1)}else S.view="week";
    pending=null;save();render();return;
  }
  if(e.target.closest("#prevBtn")||e.target.closest("#nextBtn")){
    const s=e.target.closest("#prevBtn")?-1:1;
    if(S.view==="week")cur=addDays(cur,7*s);else curMonth=D(curMonth.getFullYear(),curMonth.getMonth()+1+s,1);
    pending=null;render();return;
  }
  if(e.target.closest("#nowBtn")){cur=mondayOf(new Date());curMonth=D(new Date().getFullYear(),new Date().getMonth()+1,1);render();return}
  const wb=e.target.closest("[data-week]");
  if(wb){cur=parse(wb.dataset.week);S.view="week";save();render();window.scrollTo({top:0});return}
  const pp=e.target.closest(".pp");
  if(pp){newPri=pp.dataset.pri;document.querySelectorAll(".pp").forEach(b=>b.setAttribute("aria-pressed",b===pp));$("newTask").focus();return}
  if(e.target.closest(".tin"))return;

  const c=e.target.closest(".chip");
  if(c){
    const src=c.dataset.src,id=c.dataset.id,day=c.dataset.day!=null?+c.dataset.day:null;
    const w=W(key(cur)),{list,item}=find(src,id,day);if(!item)return;
    if(e.target.closest(".x")){
      if(src==="prev")w.dismissed.push(item.text);else list.splice(list.indexOf(item),1);
      if(pending&&pending.id===id)pending=null;
    }else if(e.target.closest(".dot")){
      if(src!=="prev")item.pri=PRI[(PRI.indexOf(item.pri)+1)%3];
    }else if(e.target.closest(".bell")){
      editTime=id;
    }else if(e.target.closest(".txt")){
      if(src==="day")item.done=!item.done;
      else pending=pending&&pending.id===id?null:{src,id,text:item.text};
    }
    save();render();return;
  }
  const cell=e.target.closest(".cell.day");
  if(cell&&pending){drop(pending.src,pending.id,null,cell.dataset.slot)}
});

document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="wallFile"){takeWallpaper(el.files&&el.files[0]);el.value="";return}
  if(el.id==="voiceSw"){S.voice=el.checked;save();return}
  if(el.id==="chimeSw"){S.chime=el.checked;if(el.checked){unlockAudio();chime()}save();return}
  if(el.id==="region"){S.region=el.value;save();render();return}
  if(el.classList.contains("tin")){
    const w=W(key(cur)),x=w.days[+el.dataset.day].find(y=>y.id===el.dataset.id);
    if(x){if(el.value)x.time=el.value;else delete x.time;delete x.fired}
    editTime=null;save();render();checkReminders();
  }
});
document.addEventListener("input",e=>{if(e.target.id==="opRange"){S.op=+e.target.value;document.body.style.setProperty("--op",S.op+"%");save()}});
document.addEventListener("focusout",e=>{
  if(e.target.classList&&e.target.classList.contains("tin")){setTimeout(()=>{if(editTime&&!document.querySelector(".tin:focus")){editTime=null;render()}},200)}
});

document.addEventListener("submit",e=>{
  if(e.target.id!=="addForm")return;e.preventDefault();
  const v=$("newTask").value.trim();if(!v)return;
  W(key(cur)).inbox.push({id:uid(),text:v,pri:newPri});$("newTask").value="";
  save();render();$("newTask").focus();
});

/* ---------- drag: pointer events so it works with mouse and touch ---------- */
let drag=null,suppressUntil=0;
document.addEventListener("pointerdown",e=>{
  const c=e.target.closest(".chip");if(!c||e.button!==0)return;
  if(e.target.closest(".x,.dot,.bell,.tin"))return;
  if(e.pointerType!=="mouse"&&!e.target.closest(".grip"))return;
  drag={c,x:e.clientX,y:e.clientY,on:false};
});
window.addEventListener("pointermove",e=>{
  if(!drag)return;
  if(!drag.on){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
    drag.on=true;const r=drag.c.getBoundingClientRect();
    drag.dx=drag.x-r.left;drag.dy=drag.y-r.top;
    drag.g=drag.c.cloneNode(true);drag.g.classList.add("ghost");drag.g.style.width=r.width+"px";
    document.body.appendChild(drag.g);drag.c.classList.add("dragging");document.body.classList.add("is-dragging");
  }
  e.preventDefault();
  drag.g.style.transform=`translate(${e.clientX-drag.dx}px,${e.clientY-drag.dy}px) rotate(-1.5deg)`;
  const el=document.elementFromPoint(e.clientX,e.clientY);const cell=el&&el.closest(".cell");
  document.querySelectorAll(".cell.over").forEach(x=>{if(x!==cell)x.classList.remove("over")});
  if(cell&&cell.dataset.slot!=="prev")cell.classList.add("over");
},{passive:false});
function endDrag(e,commit){
  if(!drag)return;const d=drag;drag=null;
  if(!d.on)return;
  d.g.remove();d.c.classList.remove("dragging");document.body.classList.remove("is-dragging");
  document.querySelectorAll(".cell.over").forEach(x=>x.classList.remove("over"));
  suppressUntil=Date.now()+350;
  if(!commit)return;
  const el=document.elementFromPoint(e.clientX,e.clientY);const cell=el&&el.closest(".cell");
  if(cell)drop(d.c.dataset.src,d.c.dataset.id,d.c.dataset.day!=null?+d.c.dataset.day:null,cell.dataset.slot);
}
window.addEventListener("pointerup",e=>endDrag(e,true));
window.addEventListener("pointercancel",e=>endDrag(e,false));

document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(tourStep>=0){tourStep=-1;tourShow();return}
  if(editTime){editTime=null;render();return}
  if(pending){pending=null;render()}
});
if(canSpeak()){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}}

render();
checkReminders();
})();
</script>
