let skPlan=null;
function openCareer(){
  const k=SKT(),t=T(),l=skL(),{R}=skCompute(),tg=S.sk.target;
  const top=skTop(R,5);
  layer(`<div class="shead"><h2>🧭 ${k.coachBtn}</h2>${closeBtn(t)}</div>
<div class="coachme">${mascot("wave")}<div class="msg ai">${esc(top.length?k.coachHi(top.map(x=>x.s.n[l]).join("、")):k.coachHi0)}</div></div>
<div class="skroles">${ROLES.map(r=>{const m=skMatch(R,r.req);return `<button class="skrole jelly${tg&&tg.k===r.k?" on":""}" type="button" data-skrole="${r.k}"><b>${esc(r.n[l])}</b><span class="skpct">${m}%</span></button>`}).join("")}</div>
<label class="fld">${k.ownRole}<div class="row" style="flex-wrap:nowrap"><input id="skRole" type="text" maxlength="40" placeholder="${esc(k.ownRolePh)}"><button class="pill pri jelly" type="button" data-skroleai="1">${I.sparkle}${k.analyse}</button></div></label>
<div id="skCareer">${tg?careerHTML(tg,R):""}</div>`,true);

function careerHTML(tg,R){
  const k=SKT(),l=skL(),m=skMatch(R,tg.req),gaps=skGaps(R,tg.req),have=tg.req.filter(([id,lv])=>R[id].xp>=skNeed(lv));
  skPlan=skPlan&&skPlan.role===tg.role?skPlan:buildPlan(tg,R);
  return `<div class="skres jelly"><h3>${esc(tg.role)} <span class="skpct">${m}%</span></h3>
${tg.note?`<p>${esc(tg.note)}</p>`:""}
<div class="skbars">${tg.req.map(([id,lv0])=>{const hv=R[id].xp,lv=skNeed(lv0);return `<div class="skbar"><span>${esc(skName(id))}</span><span class="skmeter">${[1,2,3].map(n=>`<i class="${n<=hv?"have":n<=lv?"need":""}"></i>`).join("")}</span><small>${hv>=lv?"✓":`${hv}/${lv}★`}</small></div>`}).join("")}</div>
${have.length?`<p><b>${k.transfer}</b>${esc(have.map(([id])=>skName(id)).join("、"))}${R[have[0][0]].ev[0]&&R[have[0][0]].ev[0].t?` — ${k.proof}「${esc(R[have[0][0]].ev[0].t)}」`:""}</p>`:""}
${gaps.length?`<h3>${k.plan4}</h3><ol class="skplan">${[0,1,2,3].map(w=>`<li><b>${k.weekN(w+1)}</b>${skPlan.items.filter(x=>x.w===w).map(x=>`<span>${esc(x.text)}<small>${esc(skName(x.sk))}</small></span>`).join("")}</li>`).join("")}</ol>
<div class="row"><button class="pill pri jelly" type="button" data-skcal="1">${I.cal}${k.toCal}</button><button class="pill jelly" type="button" data-skgoal="1">🎯 ${k.toGoal}</button><button class="pill jelly" type="button" data-skplanai="1">${I.sparkle}${k.aiTune}</button></div>
<p class="note" id="skPlanNote">${skPlan.ai?k.aiMade:k.libMade}</p>`:`<p class="note">${k.ready}</p>`}</div>`;
}
// four weeks, three tasks a week, biggest gaps first; weekday slots Tue / Thu / Sat
function buildPlan(tg,R){
  const l=skL(),gaps=skGaps(R,tg.req),items=[];if(!gaps.length)return {role:tg.role,items};
  for(let w=0;w<4;w++)for(let j=0;j<3;j++){const n=w*3+j,g=gaps[n%gaps.length],s=SKMAP[g.id],p=s.p[Math.floor(n/gaps.length)%2];items.push({w,d:[1,3,5][j],text:p[l],sk:g.id})}
  // drop exact duplicates in the same week
  const seen=new Set();return {role:tg.role,items:items.filter(x=>{const q=x.w+x.text;if(seen.has(q))return false;seen.add(q);return true})};
}
function pickRole(rk){const r=ROLES.find(x=>x.k===rk);if(!r)return;S.sk.target={k:r.k,role:r.n[skL()],req:r.req.slice(),note:""};skPlan=null;save();
  const {R}=skCompute();$("skCareer").innerHTML=careerHTML(S.sk.target,R);document.querySelectorAll("[data-skrole]").forEach(b=>b.classList.toggle("on",b.dataset.skrole===rk));$("skCareer").scrollIntoView({behavior:"smooth",block:"start"})}
async function roleAI(){
  const k=SKT(),t=T(),q=$("skRole").value.trim(),out=$("skCareer");if(!q){$("skRole").focus();return}
  const {R}=skCompute(),top=skTop(R,6);
  out.innerHTML=`<p class="note">${k.thinking}</p>`;await aiReady;
  if(!AI){   // no AI: the closest ready-made role by name
    const hit=ROLES.find(r=>Object.values(r.n).some(n=>n.includes(q)||q.includes(n)));
    if(hit){pickRole(hit.k);return}
    out.innerHTML=`<p class="note">${k.noAIrole}</p>`;return}
  try{
    const r=await AI.json(`Target job or role: "${q}". Using ONLY ids from this skill list, choose the 5-6 skills an entry-level person in this role needs most, with the level needed (1-5).
Skill list (id: name): ${SKILLS.map(s=>s.id+": "+s.n.en).join("; ")}
The person's current strongest skills, with evidence: ${top.map(x=>`${x.s.n.en} (${x.xp} of 3 stars, e.g. "${(R[x.s.id].ev.find(e=>e.t)||{}).t||""}")`).join("; ")||"none yet"}
Reply with ONLY JSON: {"role":"the role name in ${t.replyLang}","req":[{"id":"skill id","lv":3}],"note":"one or two sentences in ${t.replyLang}: which of their existing skills transfer to this role and why, referring to their evidence; be concrete, no empty praise"}`,{modelTier:"default",cache:false});
    const req=(Array.isArray(r.req)?r.req:[]).filter(x=>x&&SKMAP[x.id]).slice(0,6).map(x=>[x.id,Math.max(1,Math.min(5,parseInt(x.lv,10)||2))]);
    if(!req.length)throw new Error("empty");
    S.sk.target={k:"",role:String(r.role||q).slice(0,30),req,note:String(r.note||"").slice(0,200)};skPlan=null;save();
    out.innerHTML=careerHTML(S.sk.target,R);document.querySelectorAll("[data-skrole]").forEach(b=>b.classList.remove("on"));
  }catch(e){out.innerHTML=`<p class="note">${esc(e&&e.code?aiErrText(e):k.noAIrole)}</p>`}
}
// let the AI rewrite the four weeks around the person's own situation
async function planAI(){
  const k=SKT(),t=T(),tg=S.sk.target,note=$("skPlanNote");if(!tg)return;
  const {R}=skCompute(),gaps=skGaps(R,tg.req);note.textContent=k.thinking;await aiReady;
  if(!AI){note.textContent=k.noAIplan;return}
  const recent=[];Object.keys(S.weeks).sort().slice(-2).forEach(kk=>S.weeks[kk].days.forEach(d=>d.forEach(x=>recent.push(x.text))));
  try{
    const r=await AI.json(`Make a 4-week practice plan so this person grows toward "${tg.role}". Each week has exactly 3 small, concrete tasks (15-45 minutes each) that fit a busy life; each task trains one gap skill and should produce something visible (a post, a page, a recording, a conversation).
Gap skills (id, have level → needed level): ${gaps.map(g=>`${g.id} ${g.have}→${g.lv}`).join(", ")}
Their recent calendar, to fit around: ${recent.slice(0,20).join(" / ")||"empty"}
Reply with ONLY JSON: {"items":[{"w":0,"d":1,"text":"task in ${t.replyLang}, max 24 characters/6 words","sk":"gap skill id"}]} where w is week 0-3 and d is day 0-6 (0 = Monday).`,{modelTier:"default",cache:false});
    const items=(Array.isArray(r.items)?r.items:[]).filter(x=>x&&x.text&&SKMAP[x.sk]).slice(0,14).map(x=>({w:Math.max(0,Math.min(3,parseInt(x.w,10)||0)),d:Math.max(0,Math.min(6,parseInt(x.d,10)||0)),text:String(x.text).slice(0,40),sk:x.sk}));
    if(items.length<4)throw new Error("short");
    skPlan={role:tg.role,items,ai:true};$("skCareer").innerHTML=careerHTML(tg,R);
  }catch(e){note.textContent=e&&e.code?aiErrText(e):k.noAIplan}
}
// the plan lands in the real calendar, week by week, tagged with its skill
function planToCal(){
  const k=SKT(),mon=mondayOf(new Date()),today=key(new Date());if(!skPlan)return;let n=0;
  if(S.example){S.example=false;S.weeks={}}
  skPlan.items.forEach(x=>{let d=addDays(mon,7*x.w+x.d);if(key(d)<today)d=addDays(d,7);const w=W(key(mondayOf(d))),i=(d.getDay()+6)%7;
    if(!w.days[i].some(y=>y.text===x.text)){w.days[i].push({id:uid(),text:x.text,pri:x.w===0?"high":"mid",done:false,sk:[x.sk]});n++}});
  save();toast(k.calDone(n));
}
// …or becomes the eight steps of the Future Grid, one milestone every few days
function planToGoal(btn){
  const k=SKT(),tg=S.sk.target;if(!skPlan||!tg)return;
  if(S.goal&&S.goal.title&&S.goal.title!==k.goalTitle(tg.role)&&!btn.dataset.sure){btn.dataset.sure="1";btn.textContent=k.replaceQ(S.goal.title);return}
  const it=skPlan.items.slice(0,8),mon=mondayOf(new Date());
  S.goal={title:k.goalTitle(tg.role),why:tg.note||"",steps:Array.from({length:8},(_,i)=>{const x=it[i];return x?{text:x.text,date:key(addDays(mon,7*x.w+x.d)),done:false,sk:[x.sk]}:{text:"",date:"",done:false}})};
  walkerP=0;S.example=false;save();goFace(1);toast(k.goalDone);
}
// the AI sorts finished tasks the keywords couldn't place
async function tagWithAI(){
  const k=SKT(),{unknown}=skCompute();if(!unknown.length)return;await aiReady;
  if(!AI){toast(k.noAItag);return}
  toast(k.thinking);
  try{
    const r=await AI.json(`Match each finished task to 0-2 skills it trained. Skill list (id: name): ${SKILLS.map(s=>s.id+": "+s.n.en).join("; ")}
Tasks: ${JSON.stringify(unknown.slice(0,40))}
Reply with ONLY a JSON object that maps each exact task text to an array of skill ids ([] if none fit).`,{modelTier:"quick",cache:false});
    let n=0;Object.entries(r||{}).forEach(([tx,ids])=>{if(unknown.includes(tx)&&Array.isArray(ids)){S.sk.tags[tx]=ids.filter(x=>SKMAP[x]).slice(0,2);n++}});
    save();render();toast(k.tagged(n));
  }catch(e){toast(aiErrText(e))}
}

// AI adds linked words around this card; they join this root under ✨
async function pGrow(){
  const p=PT(),t=T(),cur=pCur(),out=$("pexOut");if(!cur||!out)return;const x=cur.x,have=pLinks(x).map(l=>l.y.en);
  out.innerHTML=`<p class="note" style="text-align:center">${p.growing}</p>`;await aiReady;
  if(!AI){out.innerHTML=`<p class="note" style="text-align:center">${p.noAIgrow}</p>`;return}
  try{
    const r=await AI.json(`You build a picture dictionary for children. The card is "${x.en}" (${x.zh}).
Suggest 6 more words linked to it that a child meets in real life, in three kinds:
"kin" = same family or same kind (e.g. cat → lion, tiger), "thing" = things that go with it (e.g. cat → cat litter, feather duster), "where" = where you find it.
Do not repeat: ${[x.en,...have].join(", ")}.
Reply with ONLY JSON: {"words":[{"rel":"kin|thing|where","e":"one emoji that pictures it","en":"English","zh":"Traditional Chinese (Taiwan)","ja":"Japanese as normally written","jk":"hiragana reading if ja has kanji, else empty","tw":"Taiwanese Hokkien in Han characters only if you are sure, else empty","tl":"Tâi-lô for tw, else empty"}]}
Only real, common words; never invent.`,{modelTier:"default",cache:false});
    const words=(Array.isArray(r.words)?r.words:[]).filter(w=>w&&w.en&&w.zh&&w.e).slice(0,8);
    if(!words.length)throw new Error("empty");
    const links=S.pd.links[x.en]=S.pd.links[x.en]||[];let n=0;
    words.forEach(w=>{const en=String(w.en).trim().toLowerCase().slice(0,40);if(!en||en===x.en)return;
      if(!pFind(en)){S.pd.extra[en]={e:String(w.e).slice(0,8),zh:String(w.zh).slice(0,20),en,ja:String(w.ja||"").slice(0,20),jk:String(w.jk||"").slice(0,30),tw:String(w.tw||"").slice(0,20),tl:String(w.tl||"").slice(0,40),root:x.root||pcat().k,sub:"ai",ai:1};n++}
      if(!links.some(l=>l.en===en))links.push({rel:["kin","thing","where"].includes(w.rel)?w.rel:"thing",en})});
    PBANK=null;save();render();toast(p.grown(n));
  }catch(e){const o=$("pexOut");if(o)o.innerHTML=`<p class="note" style="text-align:center">${esc(e&&e.code?aiErrText(e):p.noAIgrow)}</p>`}
}

// word games from classrooms around the world; each round: see, hear, choose
let pg=null;
const PG_LIST=[
  {k:"find",f:"🌟",langs:"en ja zh tw"},{k:"word",f:"🌟",langs:"en ja zh tw"},{k:"cloze",f:"🇹🇼",langs:"en ja zh tw"},{k:"spell",f:"🇺🇸",langs:"en ja zh tw"},
  {k:"spy",f:"🇬🇧",langs:"en ja"},{k:"karuta",f:"🇯🇵",langs:"en ja zh tw"},{k:"hang",f:"🇬🇧",langs:"en"},{k:"mix",f:"🎲",langs:"en ja zh tw"}];
const pgAvail=()=>PG_LIST.filter(g=>g.langs.includes(S.pd.lang));
const pShuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pgKana=x=>(x.jk||x.ja||"").replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const pgFirst=x=>S.pd.lang==="en"?x.en[0].toUpperCase():pgKana(x)[0]||"";
// the pieces a word is spelled from, per language
function pgPieces(x){const l=S.pd.lang;
  if(l==="en")return x.en.toLowerCase().replace(/[^a-z]/g,"").split("");
  if(l==="ja")return pgKana(x).replace(/[^ぁ-んー]/g,"").split("");
  if(l==="tw")return (x.tl||"").split("-").filter(Boolean);
  return [...x.zh]}
function pgCards(){const c=pcards().slice(0,pOpen(pcat())===Infinity?undefined:pOpen(pcat()));return c}
function pgGameFor(gm,cards){
  if(gm==="spell"||gm==="hang")return cards.filter(x=>{const n=pgPieces(x).length;return n>=2&&n<=9});
  if(gm==="spy")return cards.filter(x=>pgFirst(x));
  return cards}
function pNewGame(gm){
  const all=pgCards(),kinds=gm==="mix"?pgAvail().filter(g=>g.k!=="mix").map(g=>g.k):[gm];
  const pool=pgGameFor(gm==="mix"?"find":gm,all);
  if(pool.length<4){pg={few:true,gm};return}
  const total=gm==="hang"?5:Math.min(10,pool.length);
  pg={gm,kinds,round:0,score:0,total,cards:all,pool,order:pShuffle(pool),missed:[],t0:Date.now(),fast:0};pRound();
}
function pRound(){
  const g=pg,kind=g.kinds.length>1?g.kinds[g.round%g.kinds.length]:g.kinds[0];let x=g.order[g.round%g.order.length];
  if(!pgGameFor(kind,[x]).length){const alt=pgGameFor(kind,g.pool)[0];if(alt)x=alt}
  g.kind=kind;g.x=x;g.done=false;g.pick=[];g.miss=0;g.start=Date.now();
  const others=pShuffle(g.cards.filter(y=>y!==x&&pWord(y,S.pd.lang)!==pWord(x,S.pd.lang)));
  if(kind==="spy"){const f=pgFirst(x);g.opts=pShuffle([x,...others.filter(y=>pgFirst(y)!==f).slice(0,7)])}
  else if(kind==="cloze")g.opts=pShuffle([x,...others.slice(0,3)]);
  else g.opts=pShuffle([x,...others.slice(0,7)]);
  if(kind==="spell"){const p=pgPieces(x),dec=pShuffle(others.flatMap(pgPieces).filter(c=>!p.includes(c))).slice(0,S.pd.lang==="zh"?3:2);g.tiles=pShuffle([...p,...dec].map((c,i)=>({c,i})))}
  if(kind==="hang"){g.guess=[];g.lives=6}
  const say=kind==="find"||kind==="word"||kind==="karuta"||kind==="spell";
  setTimeout(()=>{if(pg===g&&S.face===4&&S.pd.mode==="game"&&say)pSpeakCard(x,S.pd.lang)},450);
}

// only plain shapes survive: no scripts, links, text or outside references
function cleanSVG(src){
  try{
    const doc=new DOMParser().parseFromString(String(src||"").slice(0,12000),"image/svg+xml"),root=doc.documentElement;
    if(!root||root.nodeName!=="svg"||doc.querySelector("parsererror"))return "";
    const TAGS=new Set(["svg","g","path","circle","ellipse","rect","line","polyline","polygon","defs","linearGradient","radialGradient","stop"]);
    const ATTR=/^(viewBox|xmlns|d|cx|cy|r|rx|ry|x|y|x1|y1|x2|y2|width|height|points|fill|stroke|stroke-width|stroke-linecap|stroke-linejoin|opacity|fill-opacity|stroke-opacity|transform|id|offset|stop-color|stop-opacity|gradientUnits|fx|fy)$/;
    const walk=el=>{[...el.children].forEach(c=>{if(!TAGS.has(c.nodeName)){c.remove();return}[...c.attributes].forEach(a=>{if(!ATTR.test(a.name)||/url\((?!#)|javascript:/i.test(a.value))c.removeAttribute(a.name)});walk(c)})};
    [...root.attributes].forEach(a=>{if(!ATTR.test(a.name))root.removeAttribute(a.name)});walk(root);
    root.setAttribute("xmlns","http://www.w3.org/2000/svg");if(!root.getAttribute("viewBox"))root.setAttribute("viewBox","0 0 100 100");
    const out=new XMLSerializer().serializeToString(root);if(out.length>9000||!/<(path|circle|ellipse|rect|polygon)/.test(out))return "";
    return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(out);
  }catch(e){return ""}
}

    P("hill",[["🌳",34,62,110],["🐇",40,84,46],["💤",52,70,30]],null,"兔子在樹蔭下躺下來，舒服得呼呼大睡。","He lay down in the shade and was soon fast asleep.","うさぎは こかげで よこになり、ぐうぐう ねむって しまいました。"),
    P("meadow",[["☀️",80,18,44],["🐢",46,80,62],["💧",60,64,20]],null,"烏龜一步一步往前爬。太陽好大，他好累，可是他一次也沒有停下來。","The tortoise kept going, step by step. The sun was hot and he was tired, but he never once stopped.","かめは いっぽ いっぽ すすみました。おひさまは あつくて つかれたけれど、いちども とまりませんでした。"),
    P("hill",[["🌳",34,62,110],["🐇",40,84,40],["💤",50,72,24],["🐢",66,80,50]],null,"烏龜悄悄經過睡著的兔子，繼續往山丘上爬。","Quietly, the tortoise passed the sleeping hare and kept climbing.","かめは ねている うさぎの よこを そっと とおりすぎ、おかを のぼりつづけました。"),
    P("sunset",[["🐇",40,78,60],["❗",50,56,30]],null,"兔子醒來時，太陽已經快下山了。他跳起來，拚命往前衝——","When the hare woke, the sun was setting. He jumped up and ran as fast as he could—","うさぎが めを さますと、もう ゆうがた。とびおきて、いっしょうけんめい はしりましたが——"),
    P("hill",[["🐢",78,52,52],["🎉",60,26,40],["🦊",88,64,36],["🐿️",64,64,28],["🐇",22,86,40]],null,"可是烏龜已經站在大樹下，大家正在為他歡呼！","but the tortoise was already under the big tree, and everyone was cheering for him!","かめは もう おおきな きの したに いて、みんなが はくしゅして いました！"),
    P("sunset",[["🐇",36,78,58],["🐢",62,80,54],["💛",50,52,30]],null,"兔子紅著臉說：「對不起，我不該笑你。」烏龜笑著說：「慢慢來沒關係，只要不放棄。」","Red-faced, the hare said, “I'm sorry I laughed at you.” The tortoise smiled. “Slow is fine, as long as you don't give up.”","うさぎは まっかに なって「わらって ごめんね」。かめは にっこり。「ゆっくりでも いいんだよ。あきらめなければ ね。」")]},
  {id:"jacobs-pigs",f:"🇬🇧",age:1,t:{zh:"三隻小豬",en:"The Three Little Pigs",ja:"三びきのこぶた"},src:{zh:"英國民間故事（喬瑟夫・雅各布斯整理）",en:"English fairy tale (Joseph Jacobs)",ja:"イギリスの昔話（ジェイコブズ）"},pages:[
    P("kitchen",[["🐖",70,70,76],["🐷",28,80,44],["🐷",42,82,44],["🐷",56,80,44]],null,"從前，豬媽媽有三隻小豬。有一天她說：「你們長大了，去蓋自己的房子吧！」","Once upon a time, a mother pig had three little pigs. One day she said, “You're big now. Go and build houses of your own!”","むかし、おかあさんぶたと 三びきの こぶたが いました。「もう おおきく なったね。じぶんの いえを たてて おいで。」"),
    P("meadow",[["👨‍🌾",66,70,70],["🌾",82,76,50],["🐷",32,80,52]],null,"老大遇到一個揹稻草的人：「請給我一些稻草好嗎？」他一下子就蓋好了草屋。","The first pig met a man with a bundle of straw. “May I have some straw, please?” He built a straw house in no time.","一ばんめの こぶたは わらを もった ひとに あいました。「わらを ください。」すぐに わらの いえが できました。"),
    P("forest",[["🪵",68,78,56],["🛖",40,66,90],["🐷",62,84,44]],null,"老二遇到一個揹木柴的人，用木頭蓋了一間木屋。","The second pig met a man with a load of sticks and built a house of sticks.","二ばんめの こぶたは きを もった ひとに あい、きの いえを たてました。"),
    P("village",[["🧱",26,80,48],["🧱",34,80,48],["🏠",62,62,110],["🐷",40,84,46]],null,"老三遇到一個推磚頭的人。他一塊一塊慢慢疊，花了好久，才蓋好一間堅固的磚屋。","The third pig met a man with a cart of bricks. Brick by brick, he worked a long time and built a strong brick house.","三ばんめの こぶたは レンガを はこぶ ひとに あいました。ひとつ ひとつ つみあげて、じょうぶな レンガの いえを たてました。"),
    P("meadow",[["🛖",32,66,96],["🐺",70,72,72]],null,"大野狼來敲草屋的門：「小豬小豬，讓我進去！」「不行不行，我下巴的毛可不答應！」","The wolf knocked at the straw house. “Little pig, little pig, let me come in!” “No, no, not by the hair of my chinny chin chin!”","おおかみが わらの いえに きました。「こぶたくん、いれて おくれ！」「だめ だめ、ぜったい だめ！」"),
    P("meadow",[["🐺",74,72,70],["💨",52,66,54],["🌾",30,52,40],["🌾",20,40,30],["🐷",14,82,40]],null,"「那我就呼——呼——把你的房子吹倒！」草屋一下子就飛走了，老大趕快逃到老二家。","“Then I'll huff, and I'll puff, and I'll blow your house in!” Whoosh—the straw flew away, and the first pig ran to his brother's house.","「それなら ふうっと ふいて、いえを ふきとばして やる！」わらの いえは とんで いき、こぶたは 二ばんめの いえへ にげました。"),
    P("forest",[["🐺",76,72,70],["💨",54,66,54],["🪵",34,56,40],["🐷",12,84,38],["🐷",22,86,38]],null,"大野狼又去了木屋。呼——呼——木屋也垮了！兩隻小豬拚命跑向老三的磚屋。","Then the wolf went to the stick house. He huffed and he puffed, and down it went! The two pigs raced to the brick house.","おおかみは きの いえも ふうっと ふきとばしました！二ひきは 三ばんめの レンガの いえへ いそぎました。"),
    P("village",[["🏠",40,60,120],["🐺",78,72,70],["😤",88,50,30]],null,"大野狼吹了又吹，吹到臉都紅了，磚屋還是動也不動。","The wolf huffed and puffed until his face turned red, but the brick house did not move at all.","おおかみは かおが まっかに なるまで ふきましたが、レンガの いえは びくとも しません。"),
    P("village",[["🏠",30,60,110],["🐺",70,74,66],["🍎",84,54,34]],null,"大野狼想了一個詭計：「小豬，明天早上六點，我們一起去果園摘蘋果吧！」","The wolf thought of a trick. “Little pig, let's pick apples in the orchard at six tomorrow morning!”","おおかみは わるだくみを しました。「こぶたくん、あしたの あさ 六じに りんごを とりに いこうよ！」"),
    P("orchard",[["🐷",52,34,40],["🐺",30,82,64],["⏰",82,24,30]],null,"聰明的老三五點就先出門。他正在樹上摘蘋果，大野狼就來了！","The clever third pig went at five instead. He was up in the apple tree when the wolf arrived!","かしこい こぶたは 五じに でかけました。きの うえで りんごを とっていると、おおかみが きました！"),
    P("orchard",[["🍎",88,60,30],["🐺",78,80,56],["🐷",24,84,42],["💨",36,84,30]],null,"老三把一顆蘋果丟得好遠好遠。大野狼跑去撿，小豬就趁機跳下樹，一路跑回家。","The pig threw an apple far, far away. While the wolf chased it, the pig jumped down and ran all the way home.","こぶたは りんごを とおくへ なげました。おおかみが おいかけている あいだに、いえへ にげかえりました。"),
    P("kitchen",[["🍲",30,74,60],["🔥",30,86,40],["🐷",56,82,46],["👂",66,58,28]],null,"大野狼氣壞了：「我要從煙囪爬進去！」老三聽見了，趕快在壁爐上燒了一大鍋熱水。","The wolf was furious. “I'll climb down the chimney!” Hearing this, the third pig put a big pot of water on the fire.","おこった おおかみは「えんとつから はいって やる！」。こぶたは いそいで だんろで おおなべの おゆを わかしました。"),
    P("kitchen",[["🍲",30,74,60],["🐺",30,48,54],["💦",40,60,34],["🐷",66,82,44],["🐷",80,84,40]],null,"大野狼從煙囪滑下來，「撲通！」掉進熱水裡。他燙得哇哇大叫，逃出去再也不敢回來了。","Down the chimney came the wolf—splash!—right into the hot water. Yelping, he ran off and never came back.","おおかみは えんとつを すべりおりて、ドボン！あつい おゆの なかへ。「あちちっ！」と にげだし、もう にどと きませんでした。"),
    P("village",[["🏠",50,58,110],["🐷",30,84,44],["🐷",50,86,44],["🐷",70,84,44],["🎉",50,24,40]],null,"三隻小豬在堅固的磚屋裡一起生活。兩個哥哥說：「好房子要用心、慢慢地蓋呢！」","The three little pigs lived happily together in the strong brick house. “A good house takes time and care,” said the older two.","三びきは じょうぶな レンガの いえで なかよく くらしました。「いい いえは、じっくり ていねいに たてるんだね。」")]},
  {id:"momotaro-full",f:"🇯🇵",age:1,t:{zh:"桃太郎",en:"Momotaro, the Peach Boy",ja:"ももたろう"},src:{zh:"日本民間故事",en:"Japanese folk tale",ja:"日本の昔話"},pages:[
    P("mountain",[["👴",30,80,56],["🪵",44,84,34],["👵",70,80,56],["🧺",82,84,32]],null,"很久很久以前，住著一對老公公和老婆婆。老公公上山砍柴，老婆婆到河邊洗衣服。","Long, long ago lived an old man and an old woman. The old man went up the mountain to cut firewood, and the old woman went to the river to wash clothes.","むかし むかし、おじいさんと おばあさんが いました。おじいさんは やまへ しばかりに、おばあさんは かわへ せんたくに いきました。"),
    P("river",[["🍑",46,74,80],["👵",82,66,56],["❗",88,44,26]],null,"這時，一顆好大好大的桃子，從上游「咚咚、咚咚」地漂了下來。","Then a big, big peach came bobbing down the river—bob-bob, bob-bob.","すると、かわかみから おおきな ももが どんぶらこ、どんぶらこと ながれて きました。"),
    P("kitchen",[["🍑",50,72,90],["👴",22,76,54],["👵",80,76,54],["🔪",36,58,30]],null,"老婆婆把桃子抱回家。老公公正要切開，桃子忽然「啪」地裂開了！","The old woman carried the peach home. Just as the old man was about to cut it, it split open by itself!","おばあさんは ももを いえに もって かえりました。おじいさんが きろうと すると、ももが ぱっかーんと われました！"),
    P("kitchen",[["👶",50,72,64],["🍑",50,86,40],["👴",22,76,54],["👵",80,76,54],["✨",50,44,34]],null,"裡面跳出一個健康的小男孩！兩人高興得不得了，替他取名叫「桃太郎」。","Out jumped a healthy baby boy! Overjoyed, they named him Momotaro, “Peach Boy.”","なかから げんきな あかちゃんが！ふたりは おおよろこびで「ももたろう」と なづけました。"),
    P("village",[["🧒",46,76,70],["🪨",70,80,44],["💪",60,52,30]],null,"桃太郎吃得多、長得快，變成一個又善良又有力氣的少年。","Momotaro ate well and grew fast into a kind and strong young man.","ももたろうは すくすく そだち、やさしくて ちからもちの わかものに なりました。"),
    P("village",[["👹",78,50,58],["😢",30,80,44],["😢",46,82,40]],null,"那時候，鬼島上的鬼常常來村子搶東西，大家都很害怕。","In those days, ogres from Ogre Island often came to rob the village, and everyone was afraid.","そのころ、おにがしまの おにが むらを あらして、みんな こまって いました。"),
    P("kitchen",[["🧒",34,76,60],["🍡",56,70,40],["👵",76,76,54]],null,"桃太郎說：「我去鬼島，讓鬼不再欺負人！」老婆婆為他做了日本第一好吃的吉備糰子。","“I'll go to Ogre Island and stop them!” said Momotaro. The old woman made him the best millet dumplings in Japan.","「ぼくが おにたいじに いきます！」おばあさんは にっぽんいちの きびだんごを つくって くれました。"),
    P("meadow",[["🧒",30,76,62],["🐕",66,80,52],["🍡",48,62,30]],null,"路上，一隻小狗跑來問：「桃太郎，你腰上掛的是什麼？」「日本第一的吉備糰子。」「分我一個，我就跟你去！」","On the way, a dog ran up. “Momotaro, what's in your pouch?” “The best millet dumplings in Japan.” “Give me one, and I'll come with you!”","みちで いぬが きました。「ももたろうさん、おこしに つけた ものは なんですか？」「にっぽんいちの きびだんご。」「ひとつ ください。おともします！」"),
    P("forest",[["🧒",22,78,56],["🐕",36,82,40],["🐒",60,78,48],["🐦",80,46,42]],null,"接著，猴子和雉雞也各得到一個糰子，成了桃太郎的好夥伴。","Next, a monkey and a pheasant each got a dumpling too, and they joined Momotaro.","つぎに さると きじも きびだんごを もらって、なかまに なりました。"),
    P("sea",[["⛵",34,58,70],["🧒",30,50,34],["🏝️",82,56,60],["👹",82,40,30]],null,"他們坐船越過大海，終於看見了鬼島。島上有一扇好高好大的鐵門。","They sailed across the sea and at last saw Ogre Island, with a tall iron gate.","ふねで うみを わたり、ついに おにがしまが みえました。おおきな てつの もんが あります。"),
    P("island",[["🐦",30,20,40],["🐒",56,44,44],["🐕",36,82,44],["🧒",20,84,50]],null,"雉雞飛上天偵察，猴子爬過高牆打開大門，小狗第一個衝了進去！","The pheasant flew up to look around, the monkey climbed the wall and opened the gate, and the dog dashed in first!","きじは そらから ようすを みて、さるは へいを のぼって もんを あけ、いぬが まっさきに とびこみました！"),
    P("island",[["👹",66,72,72],["🙇",80,50,30],["🧒",30,80,54],["🐕",44,84,34],["🐒",16,84,34]],null,"大家同心協力，鬼的首領終於投降了：「對不起！我們再也不做壞事了。」","Working together, they won. The ogre chief bowed low. “We're sorry! We'll never do bad things again.”","みんなで ちからを あわせると、おにの おやぶんが あやまりました。「ごめんなさい。もう わるい ことは しません。」"),
    P("village",[["🧒",46,76,54],["💰",62,82,36],["👴",22,78,44],["👵",80,78,44],["🎉",50,28,40]],null,"桃太郎把寶物帶回村子，還給大家。村子又恢復了平靜，大家開心地慶祝。","Momotaro brought the treasure back and returned it to the villagers. Peace came back, and everyone celebrated.","ももたろうは たからものを もって かえり、むらの ひとたちに かえしました。むらは へいわに なり、みんなで おいわいしました。")]},
  {id:"tiger-grandaunt",f:"🇹🇼",age:2,t:{zh:"虎姑婆",en:"Grandaunt Tiger",ja:"トラおばさん"},src:{zh:"台灣民間故事",en:"Taiwanese folk tale",ja:"台湾の昔話"},pages:[
    P("kitchen",[["👩",72,72,64],["👧",32,80,50],["👦",46,82,42],["🚪",88,70,40]],null,"從前在山邊住著姊弟倆。有一天爸媽要出遠門，媽媽叮嚀：「晚上不管誰來，都不可以開門喔！」","Long ago, a sister and her little brother lived near the mountains. One day their parents had to go away. “Don't open the door to anyone tonight,” said Mother.","むかし、やまの ちかくに きょうだいが すんでいました。りょうしんが でかける ひ、おかあさんは いいました。「よるは だれが きても、ドアを あけちゃ だめよ。」"),
    P("nightmtn",[["🐯",40,74,74],["👀",62,58,30],["🏠",86,82,40]],null,"山裡有一隻老虎精，最喜歡吃小孩。她聽說姊弟倆自己在家，就變成老婆婆的樣子下山了。","In the mountains lived a tiger spirit who loved to eat children. Hearing the two were home alone, she disguised herself as an old woman and came down.","やまには こどもが だいすきな トラの ようかいが いました。きょうだいだけで るすばんと きいて、おばあさんに ばけて やってきました。"),
    P("night",[["🏠",34,62,110],["🐯",74,74,64],["🧣",74,58,30],["✊",58,62,26]],null,"「叩叩叩！我是你們的姑婆，快開門讓我進去。」虎姑婆壓低聲音說。","Knock, knock! “It's your grandaunt. Open the door and let me in,” said Grandaunt Tiger in a sweet, soft voice.","トントン！「おばさんだよ。あけて おくれ。」トラおばさんは やさしい こえで いいました。"),
    P("night",[["🚪",40,64,100],["🐾",56,62,40],["👧",24,80,48],["❓",24,58,26]],null,"姊姊說：「姑婆，把手伸進來給我們看看。」那隻手毛茸茸的。虎姑婆說：「姑婆老了，才穿著毛衣嘛。」","“Grandaunt, show us your hand,” said the sister. It was hairy! “I'm old, dear, so I wear a wool sweater,” said the tiger.","「おばさん、てを みせて。」その ては けむくじゃら。「としを とったから、セーターを きているんだよ。」"),
    P("kitchen",[["🚪",86,66,90],["🐯",72,74,64],["👦",46,80,42],["👧",24,80,48]],null,"弟弟相信了，偷偷打開了門。虎姑婆笑咪咪地走進屋子。","The little brother believed her and opened the door. Grandaunt Tiger walked in with a big smile.","おとうとは しんじて、ドアを あけて しまいました。トラおばさんは にこにこ はいって きました。"),
    P("bedroom",[["🛏️",50,74,110],["🐯",40,62,48],["👦",58,64,34],["👧",80,72,40],["👀",80,54,22]],null,"睡覺時，虎姑婆說：「姑婆要跟最小的弟弟一起睡。」姊姊覺得怪怪的，一直睜著眼睛。","At bedtime, the tiger said, “I'll sleep next to the littlest one.” The sister felt something was wrong and kept her eyes open.","ねる とき、トラおばさんは「いちばん ちいさい こと ねるよ」と いいました。おねえちゃんは へんだと おもって、めを あけて いました。"),
    P("bedroom",[["🛏️",50,74,110],["🐅",30,70,40],["❗",82,48,34],["👧",80,72,44]],null,"月光照進窗戶，姊姊看見被子外面露出一條長長的條紋尾巴——是老虎！","Moonlight came through the window, and the sister saw a long striped tail poking out of the blanket—a tiger!","まどから つきの ひかり。ふとんから ながい しましまの しっぽが みえました——トラだ！"),
    P("bedroom",[["👧",40,74,58],["💓",54,56,30],["👦",62,78,40]],null,"姊姊心跳得好快，但她告訴自己：「要冷靜，想辦法！」她說：「姑婆，弟弟和我想上廁所。」","The sister's heart pounded, but she told herself, “Stay calm. Think.” She said, “Grandaunt, my brother and I need the toilet.”","むねが ドキドキ。でも「おちついて、かんがえよう」。「おばさん、おとうとと トイレに いきたいの。」"),
    P("night",[["🏺",64,80,50],["🧵",48,82,36],["👧",30,80,48],["👦",18,82,40]],null,"虎姑婆怕他們跑掉，在他們腳上綁了一條繩子。一到外面，姊姊就把繩子解下來，綁在大水缸上。","Afraid they'd run away, the tiger tied a rope to their ankles. Outside, the sister untied it and tied it to the big water jar.","トラおばさんは にげないように あしに ひもを むすびました。そとに でると、おねえちゃんは ひもを ほどいて、おおきな みずがめに むすびつけました。"),
    P("tree",[["👧",60,34,40],["👦",48,44,34]],null,"姊姊牽著弟弟，爬上院子裡最高的大樹。","Holding her brother's hand, she climbed the tallest tree in the yard.","おねえちゃんは おとうとの てを ひいて、にわで いちばん たかい きに のぼりました。"),
    P("tree",[["👧",60,34,34],["👦",50,42,28],["🐯",28,82,62],["🏺",12,86,34],["💢",36,62,28]],null,"虎姑婆拉拉繩子，只拉到一個水缸！她衝出來大叫：「快下來！」","The tiger tugged the rope and pulled in… a water jar! She rushed out roaring, “Come down here!”","ひもを ひっぱると、でてきたのは みずがめ！トラおばさんは「おりて こい！」と さけびました。"),
    P("tree",[["👧",60,34,34],["🫕",52,48,30],["💦",44,62,34],["🐯",26,82,56],["💨",10,80,34]],null,"姊姊說：「姑婆，請燒一鍋熱水吊上來，我們要燙樹上的小鳥給妳吃。」熱水一吊上來，她就往下潑——虎姑婆燙得哇哇叫，逃回山裡，再也不敢來了。","“Grandaunt, boil a pot of water and pull it up, and we'll cook the birds in this tree for you.” When the pot came up, she poured it down—the tiger howled, ran back to the mountains, and never came again.","「おばさん、おゆを わかして ひもで あげて。きの うえの ことりを ゆでて あげる。」おゆが あがると、したへ ざぶん！トラおばさんは「あちっ！」と やまへ にげかえり、にどと きませんでした。"),
    P("dawn",[["👩",66,72,56],["👨",82,72,56],["👧",38,80,46],["👦",50,82,40],["💛",58,46,30]],null,"天亮了，爸媽回來了。媽媽緊緊抱住姊弟倆：「你們好勇敢！遇到危險要冷靜想辦法——還有，不要隨便幫陌生人開門。」","At dawn their parents came home and hugged them tight. “You were so brave! When there's danger, stay calm and think—and never open the door to strangers.”","よが あけて、りょうしんが かえって きました。「よく がんばったね！あぶない ときは おちついて かんがえること。それから、しらない ひとに ドアを あけないこと。」")]},
  {id:"jelly-egypt-2",f:"🍮",age:1,adv:1,t:{zh:"小潔米去埃及：人面獅身的謎題",en:"Little Jelly in Egypt: The Sphinx's Riddle",ja:"ゼリー、エジプトへ：スフィンクスのなぞなぞ"},src:{zh:"小潔米歷險記・第 1 集",en:"Little Jelly's Adventures · Book 1",ja:"ゼリーの大冒険・第1巻"},pages:[
    P("home",[["📘",70,70,56],["🗺️",66,38,50],["✨",80,26,30]],[34,74,44],"小潔米在圖鑑裡看到一座三角形的大房子。「這是什麼？誰蓋的？」這時，牆上的地圖忽然發出光來……","In a picture book, Little Jelly saw a giant triangle-shaped building. “What is it? Who built it?” Just then, the map on the wall began to glow…","ずかんに おおきな さんかくの たてもの。「これ なに？だれが つくったの？」すると かべの ちずが ひかりだし……"),
    P("desert",[["☀️",80,18,54],["💧",56,58,22],["🥵",60,70,30]],[42,76,40],"咻！小潔米來到了埃及的沙漠。太陽好大，小潔米熱得身體都軟趴趴了。「我、我要融化了……」","Whoosh! Little Jelly landed in the Egyptian desert. The sun was so hot that Jelly began to go soft and wobbly. “I'm… melting…”","ビューン！エジプトの さばくに つきました。あつくて ゼリーは ふにゃふにゃ。「と、とけちゃう……」"),
    P("desert",[["🐪",60,66,96]],[34,80,32],"一隻駱駝走過來，替他擋住太陽：「我叫阿布。坐上來吧！在沙漠裡別慌，跟著我慢慢走就好。」","A camel came over and made some shade. “I'm Abu. Hop on! Don't panic in the desert. Just follow me, slow and steady.”","ラクダが きて ひかげを つくって くれました。「ぼくは アブ。のって！さばくでは あわてないで、ゆっくり ついて おいで。」"),
    P("desert",[["🔺",60,58,120],["🔺",86,66,70],["🐪",22,76,54]],[22,58,24],"走著走著，眼前出現了好高好高的金字塔！阿布說：「這是四千多年前，古埃及國王的墓喔。」","After a while, huge pyramids rose ahead! “These are tombs of ancient Egyptian kings, built over 4,000 years ago,” said Abu.","やがて とても たかい ピラミッドが！「4000ねん いじょう まえの おうさまの おはかだよ」と アブ。"),
    P("desert",[["🔺",80,56,90],["🪨",46,74,44],["🛷",46,84,40],["👷",28,78,40],["💧",62,84,22]],[76,84,24],"「這麼大的石頭，怎麼搬上去的？」阿布說：「很多工人一起把石頭放在木橇上拉，還在沙上灑水，讓它滑得更順。」","“How did they move such big stones?” “Many workers pulled them on wooden sleds, and poured water on the sand so the sleds slid easily.”","「こんな おおきな いし、どうやって はこんだの？」「おおぜいで そりに のせて ひっぱったんだ。すなに みずを まくと すべりやすいんだよ。」"),
    P("desert",[["🦁",62,64,100],["🔺",88,58,60],["❗",40,50,26]],[28,80,32],"金字塔旁邊，趴著一座獅子身體、人頭的大雕像——人面獅身像。它忽然開口說話了！","Beside the pyramids lay a giant statue with a lion's body and a human head—the Sphinx. Suddenly, it spoke!","ピラミッドの そばには、ライオンの からだに ひとの かおの スフィンクス。とつぜん しゃべりだしました！"),
    P("desert",[["🦁",62,64,100],["🌅",14,26,34],["☀️",38,16,34],["🌙",60,20,30]],[28,80,32],"「回答我的謎題才能過去：什麼東西早上用四隻腳走路，中午用兩隻腳，晚上用三隻腳？」","“Answer my riddle to pass: what walks on four legs in the morning, two at noon, and three in the evening?”","「なぞなぞに こたえたら とおして やろう。あさは 4ほん、ひるは 2ほん、よるは 3ぼんの あしで あるく ものは なに？」"),
    P("desert",[["👶",30,40,34],["🧑",50,34,40],["🧓",70,40,36],["🦯",78,48,26]],[50,78,40],"小潔米想了好久：「是……人！小寶寶用手腳爬，長大用兩隻腳走，老了再加一根拐杖！」","Jelly thought hard. “It's… a person! Babies crawl on hands and knees, grown-ups walk on two legs, and old people use a cane!”","ゼリーは かんがえました。「わかった、にんげん！あかちゃんは はいはい、おとなは 2ほん、としよりは つえを ついて 3ぼん！」"),
    P("desert",[["🦁",62,64,100],["🪲",36,52,34],["🎉",60,24,40]],[30,80,34],"「答對了！」人面獅身像笑了，送給小潔米一枚金色的聖甲蟲貼紙。","“Correct!” The Sphinx smiled and gave Little Jelly a golden scarab sticker.","「せいかい！」スフィンクスは わらって、きんいろの スカラベの シールを くれました。"),
    P("river",[["⛵",54,62,70],["🐪",80,72,40],["🌇",20,24,40]],[52,54,24],"傍晚，阿布帶小潔米坐船遊尼羅河。河上的風涼涼的，小潔米又變回Q彈的樣子了。","In the evening, Abu took Jelly on a boat on the Nile. The cool river breeze made Jelly bouncy again.","ゆうがた、ナイル川を ふねで すすみました。かわの かぜは すずしくて、ゼリーは また ぷるぷるに。"),
    P("night",[["📕",70,70,44],["🔺",86,76,50],["📮",46,30,38],["🗼",46,22,20]],[30,76,40],"「謝謝你，阿布！」小潔米在護照上蓋下埃及的印章。這時，一張印著高塔的明信片飛了過來……下一站是哪裡呢？","“Thank you, Abu!” Jelly stamped Egypt into the passport. Just then, a postcard with a tall tower fluttered by… Where to next?","「ありがとう、アブ！」パスポートに エジプトの スタンプ。そこへ たかい とうの えはがきが とんで きて……つぎは どこ？")]},
  {id:"jelly-paris-2",f:"🍮",age:2,adv:1,t:{zh:"小潔米在巴黎：找回蒙娜麗莎的微笑",en:"Little Jelly in Paris: Finding the Mona Lisa's Smile",ja:"ゼリー、パリへ：モナ・リザの ほほえみ"},src:{zh:"小潔米歷險記・第 2 集",en:"Little Jelly's Adventures · Book 2",ja:"ゼリーの大冒険・第2巻"},pages:[
    P("city",[["🗼",66,48,130],["📮",40,30,30]],[30,78,36],"小潔米跟著明信片來到法國巴黎。眼前就是艾菲爾鐵塔，高得要把頭仰到最後面才看得到頂端！","Following the postcard, Little Jelly arrived in Paris, France. There stood the Eiffel Tower—so tall Jelly had to lean all the way back to see the top!","えはがきを おって、フランスの パリへ。エッフェル塔は、うんと そりかえらないと てっぺんが みえないほど たかい！"),
    P("city",[["🕊️",62,60,56],["🗼",86,50,70]],[32,78,36],"一隻鴿子停在旁邊：「Bonjour！我是皮耶，巴黎的大街小巷我都熟。你想看什麼？」","A pigeon landed nearby. “Bonjour! I'm Pierre. I know every street in Paris. What would you like to see?”","ハトが おりて きました。「ボンジュール！ぼくは ピエール。パリの ことなら まかせて。なにが みたい？」"),
    P("bakery",[["🥖",60,62,64],["🥐",78,72,44],["🕊️",82,40,34]],[34,76,38],"「我想看蒙娜麗莎的微笑！」「那得先吃飽，羅浮宮大得走不完喔。」剛出爐的長棍麵包外皮好酥脆，可頌一層一層的，香得不得了。","“I want to see the Mona Lisa's smile!” “Then eat first. The Louvre is huge.” The fresh baguette was crunchy outside, and the croissant had layer after flaky layer.","「モナ・リザの ほほえみが みたい！」「じゃあ まず たべよう。ルーブルは とても ひろいからね。」やきたての バゲットは パリッ、クロワッサンは サクサク。"),
    P("louvre",[["🕊️",72,30,36]],[30,82,34],"羅浮宮門口有一座玻璃金字塔。「咦？我在埃及也看過金字塔！」小潔米笑了。","At the Louvre stood a glass pyramid. “Hey, I saw pyramids in Egypt!” Jelly laughed.","ルーブル美術館の まえには ガラスの ピラミッド。「あれ？エジプトでも ピラミッドを みたよ！」"),
    P("museum",[["🖼️",50,34,60],["🧍",36,70,56],["🧍‍♀️",52,70,56],["🧍",68,70,56]],[50,86,28],"蒙娜麗莎前面擠滿了人。小潔米太矮了，怎麼跳都只看到大家的後腦杓。","The Mona Lisa room was packed. Jelly was too short and could only see the backs of people's heads.","モナ・リザの まえは ひとで いっぱい。ゼリーは せが ひくくて、みんなの あたましか みえません。"),
    P("museum",[["🖼️",20,34,40],["🖼️",80,34,40],["❓",60,56,30]],[50,78,36],"一轉身——皮耶不見了！到處都是長長的走廊，小潔米迷路了。","And when Jelly turned around—Pierre was gone! Long hallways everywhere. Jelly was lost.","ふりかえると——ピエールが いない！ながい ろうかばかりで、ゼリーは まいごに なりました。"),
    P("museum",[["🗺️",64,58,56],["➡️",80,78,30],["💭",36,48,30]],[36,78,38],"小潔米想起阿布說的話：「別慌，慢慢走。」他找到館內地圖，跟著「蒙娜麗莎」的標示一步一步走回去。","Jelly remembered what Abu said: “Don't panic. Slow and steady.” Jelly found a museum map and followed the signs to the Mona Lisa, step by step.","ゼリーは アブの ことばを おもいだしました。「あわてないで、ゆっくり。」あんないずを みつけて、モナ・リザの ひょうしきを たどりました。"),
    P("museum",[["🖼️",50,30,64],["🧍",36,76,50],["🧍",64,76,50],["💫",50,56,30]],[50,44,30],"回到畫前，小潔米用Q彈的果凍身體「啵嚶——」彈得好高，終於看見了！她的微笑好溫柔，又好神秘。","Back at the painting, Jelly bounced—boing!—high into the air and finally saw it. Her smile was gentle and mysterious.","えの まえで、ゼリーは ぷるるんと たかく はずんで、やっと みえました！やさしくて ふしぎな ほほえみ。"),
    P("museum",[["🖼️",50,30,64],["👩‍🏫",76,72,56],["🕊️",24,46,40]],[40,80,34],"解說員說：「達文西用了『暈塗法』，把邊緣畫得像煙霧一樣柔和，所以她的微笑看起來好像一直在變。」這時，皮耶也飛回來了！","A guide explained, “Leonardo da Vinci used sfumato, blending the edges softly like smoke, so her smile seems to keep changing.” Just then, Pierre flew back!","ガイドさんが いいました。「ダ・ヴィンチは スフマートで りんかくを けむりのように ぼかしたの。だから ほほえみが かわって みえるのよ。」そこへ ピエールも もどって きました！"),
    P("palace",[["🪞",30,54,60],["🪞",70,54,60]],[50,78,34],"下午，他們去了凡爾賽宮的鏡廳。每一面鏡子裡都有一個小潔米，好像來了一整群小潔米！","In the afternoon they visited the Hall of Mirrors at Versailles. There was a Little Jelly in every mirror—like a whole crowd of Jellies!","ごごは ベルサイユ宮殿の 鏡の間へ。どの かがみにも ゼリーが うつって、ゼリーが いっぱい！"),
    P("night",[["🗼",64,52,130],["✨",70,20,40],["📕",30,64,34],["🕊️",86,30,30]],[26,80,36],"晚上，鐵塔每到整點就閃閃發光。小潔米在護照蓋下法國的印章：「謝謝你，皮耶！下一站，我想去……」","At night, the tower sparkled on every hour. Jelly stamped France into the passport. “Thank you, Pierre! Next, I want to go to…”","よるの タワーは まいじ キラキラ。パスポートに フランスの スタンプ。「ありがとう、ピエール！つぎは……」")]}
];

  {id:"tortoise",f:"🇬🇷",age:1,t:{zh:"龜兔賽跑",en:"The Tortoise and the Hare",ja:"うさぎとかめ"},src:{zh:"伊索寓言",en:"Aesop's Fables",ja:"イソップ物語"},pages:[
    P("meadow",[["🐢",30,74,58],["🐇",68,72,58]],null,"兔子笑烏龜走得好慢。","The hare laughed at the slow tortoise.","うさぎは のろい かめを わらいました。"),
    P("meadow",[["🐢",30,74,54],["🐇",48,72,54],["🏁",84,66,52]],null,"他們決定比賽，看誰先到終點。","They decided to race to the finish line.","ふたりは ゴールまで きょうそうする ことに しました。"),
    P("meadow",[["🐇",78,70,54],["🐢",18,76,48]],null,"兔子一下子就跑得好遠。","The hare ran far ahead in no time.","うさぎは あっというまに とおくまで はしりました。"),
    P("meadow",[["🌳",70,50,120],["🐇",60,78,48],["💤",76,60,30]],null,"兔子覺得一定會贏，就在樹下睡著了。","Sure he would win, the hare fell asleep under a tree.","うさぎは かつと おもって、きの したで ねむって しまいました。"),
    P("meadow",[["🐢",52,74,56],["🏁",84,66,52]],null,"烏龜一步一步，一直沒有停。","Step by step, the tortoise never stopped.","かめは いっぽ いっぽ、やすまず すすみました。"),
    P("meadow",[["🐢",76,72,60],["🏁",88,62,50],["🎉",56,34,48],["🐇",18,78,36]],null,"烏龜贏了！慢慢來，只要不放棄就好。","The tortoise won! Slow and steady wins the race.","かめの かち！ゆっくりでも、あきらめなければ だいじょうぶ。")]},
  {id:"pigs",f:"🇬🇧",age:1,t:{zh:"三隻小豬",en:"The Three Little Pigs",ja:"三びきのこぶた"},src:{zh:"英國民間故事",en:"English folk tale",ja:"イギリスの昔話"},pages:[
    P("village",[["🐷",30,76,48],["🐷",48,78,48],["🐷",66,76,48]],null,"三隻小豬要各自蓋房子。","Three little pigs each built a house.","三びきの こぶたが それぞれ いえを たてました。"),
    P("meadow",[["🐷",28,76,46],["🌾",44,70,50],["🐷",62,76,46],["🪵",78,72,46]],null,"老大用稻草，老二用木頭，很快就蓋好了。","One used straw, one used sticks, and they finished fast.","ひとりは わら、ひとりは きで、すぐに たてました。"),
    P("village",[["🐷",40,78,48],["🧱",62,74,56]],null,"老三用磚頭，慢慢蓋得很牢固。","The third pig used bricks and built slowly and strongly.","三びきめは レンガで、じっくり じょうぶに たてました。"),
    P("forest",[["🐺",32,72,60],["💨",54,64,46],["🌾",76,74,40],["🪵",86,78,34]],null,"大野狼來了，一吹就把草屋和木屋吹倒了！","The big bad wolf came and blew down the straw and stick houses!","おおかみが きて、わらの いえと きの いえを ふきとばしました！"),
    P("home",[["🐷",36,76,44],["🐷",52,78,44],["🐷",68,76,44],["🐺",90,64,34]],null,"小豬們躲進磚頭屋，大野狼怎麼吹都吹不倒。","The pigs hid in the brick house. The wolf huffed and puffed, but it stood.","こぶたたちは レンガの いえへ。おおかみが ふいても びくとも しません。"),
    P("home",[["🐷",36,76,46],["🐷",52,78,46],["🐷",68,76,46],["🎉",52,34,46]],null,"用心做好一件事，就能保護自己和家人。","Doing a job carefully keeps you and your family safe.","ていねいに つくれば、じぶんも かぞくも まもれるね。")]},
  {id:"momotaro",f:"🇯🇵",age:1,t:{zh:"桃太郎",en:"Momotaro, the Peach Boy",ja:"ももたろう"},src:{zh:"日本民間故事",en:"Japanese folk tale",ja:"日本の昔話"},pages:[
    P("river",[["🍑",52,70,70],["👵",26,68,56]],null,"老奶奶在河邊撿到一顆好大的桃子。","An old woman found a huge peach by the river.","おばあさんが かわで おおきな ももを ひろいました。"),
    P("home",[["👶",50,70,56],["🍑",50,52,40],["👴",24,72,50],["👵",76,72,50]],null,"桃子裡跑出一個男孩，大家叫他桃太郎。","A baby boy came out of it. They named him Momotaro.","ももから おとこのこが うまれ、ももたろうと なづけました。"),

function shrinkImage(file,max){

    img.onload=()=>{const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      const du=c.toDataURL("image/jpeg",.82);res({mime:"image/jpeg",data:du.split(",")[1],url:du})};

/* ---------- theme music: an original generative track per look, plus YouTube picks ---------- */
function ambTheme(ctx,out,track){
  const now=()=>ctx.currentTime,hz=m=>440*Math.pow(2,(m-69)/12);

  const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=track==="chip"?2600:5200;lp.connect(out);lp.connect(dl);AMB.nodes.push(lp);
  const tone=(m,vol,len,type,harm)=>{const o=ctx.createOscillator(),e=ctx.createGain();o.type=type;o.frequency.value=hz(m);
    e.gain.setValueAtTime(0,now());e.gain.linearRampToValueAtTime(vol,now()+(type==="square"?.005:.01));e.gain.exponentialRampToValueAtTime(.0001,now()+len);o.connect(e);e.connect(lp);o.start();o.stop(now()+len+.05);
    if(harm){const o2=ctx.createOscillator(),e2=ctx.createGain();o2.type="sine";o2.frequency.value=hz(m)*harm;e2.gain.value=.25;o2.connect(e2).connect(e);o2.start();o2.stop(now()+len+.05)}};
  const pick=a=>a[Math.floor(Math.random()*a.length)];let beat=0;
  if(track==="night"){   // soft electric-piano 7th chords, a sparse melody, vinyl crackle
    const s=ctx.createBufferSource();s.buffer=noiseBuf(ctx,false);s.loop=true;const bp=ctx.createBiquadFilter();bp.type="highpass";bp.frequency.value=3000;const g=ctx.createGain();g.gain.value=.012;s.connect(bp).connect(g).connect(out);s.start();AMB.nodes.push(s,bp,g);
    const prog=[[50,53,57,60,64],[43,53,55,59,62],[48,52,55,59,64],[45,52,55,60,64]];const mel=[64,67,69,71,72,74,76];
    AMB.timer=setInterval(()=>{if(beat%8===0)prog[(beat/8)%4].forEach((m,i)=>setTimeout(()=>tone(m,.04,3.6,"sine",2),i*40));if(beat%2===1&&Math.random()<.45)tone(pick(mel),.05,1.6,"triangle",3);beat++},430);
  }else if(track==="classic"){   // music box: broken chords under a simple tune, I–vi–IV–V
    const prog=[[48,55,64,60],[45,52,60,57],[41,48,57,53],[43,50,59,55]],mel=[[72,76,79],[72,76,81],[72,77,81],[71,74,79]];
    AMB.timer=setInterval(()=>{const c=Math.floor(beat/8)%4,st=beat%8;tone(prog[c][st%4]+12,.035,1.2,"sine",3);if(st%2===0&&Math.random()<.7)tone(pick(mel[c])+(Math.random()<.2?12:0),.05,1.8,"sine",4.01);beat++},300);

function artMotif(x,w,h,k){

  const step=Math.max(70,Math.min(110,w/5));x.textAlign="center";x.textBaseline="middle";
  for(let y=step/2,row=0;y<h+step;y+=step*.8,row++)for(let X=(row%2?step/2:0);X<w+step;X+=step){
    x.save();x.globalAlpha=.35+rnd()*.3;x.translate(X+(rnd()-.5)*20,y+(rnd()-.5)*20);x.rotate((rnd()-.5)*.8);x.font=`${Math.round(22+rnd()*16)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;x.fillText(m[Math.floor(rnd()*m.length)],0,0);x.restore()}

},{passive:false});
function endDrag(e,commit){
  if(pdragEnd(e,commit))return;
  if(rangeEnd(e,commit))return;
  if(swipe&&commit){
    const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;
    if(Math.abs(dx)>(swipe.card?45:70)&&Math.abs(dy)<60&&Date.now()-swipe.t<700){suppressUntil=Date.now()+350;if(swipe.card){if(S.face===4&&S.pd.on)picNav(dx<0?1:-1);else wordNav(dx<0?1:-1)}else goFace(S.face+(dx<0?1:-1),dx<0?1:-1)}
  }
  swipe=null;
  if(!drag)return;const d=drag;drag=null;if(!d.on)return;
  d.g.remove();d.c.classList.remove("dragging");document.body.classList.remove("is-dragging");
  document.querySelectorAll(".cell.over").forEach(x=>x.classList.remove("over"));
  suppressUntil=Date.now()+350;
  if(!commit)return;
  const el=document.elementFromPoint(e.clientX,e.clientY),cell=el&&el.closest(".cell");
  if(cell)drop(d.c.dataset.src,d.c.dataset.id,d.c.dataset.day!=null?+d.c.dataset.day:null,cell.dataset.slot);
}
addEventListener("pointerup",e=>endDrag(e,true));
addEventListener("pointercancel",e=>endDrag(e,false));
if(canSpeak()){try{speechSynthesis.getVoices()}catch(e){}}

applySkin();
render();
checkReminders();
boot();
ysShared();
memSync();memInvite();
})();
