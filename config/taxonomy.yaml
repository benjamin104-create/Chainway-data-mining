      zh: 襯衫領
      prompt: a shirt with a classic pointed shirt collar
    - code: stand_collar
      zh: 立領
      prompt: a garment with a mandarin stand collar
    - code: peter_pan
      zh: 彼得潘領
      prompt: a garment with a rounded peter pan collar
