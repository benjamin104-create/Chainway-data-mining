# 色號對照表 —— 依貴司的「色號對照表」紙本建立
#
# 兩位數色號：十位 = 色相族，個位 = 調子。
# 這個結構本身就是資訊：56 與 57 一定是同一個色相族的相鄰調子，
# 不必查表就知道它們像不像。平鋪的色卡沒有這個性質。
#
# ── 這份檔案裡哪些是確定的、哪些不是 ──────────────────────────
#
# 確定：色號、族名、調子名、每一格的中文與英文名稱。這些直接抄自紙本。
#
# 不確定：每一格的實際 L*a*b* 值。目前沒有填。
#   刻意不從您拍的色卡照片取值 —— 那張照片有明顯的光線漸層：
#   同一列的「水藍」量出來是 #ABB8C3（一個灰藍），那是紙面反光造成的，
#   不是色票本身的顏色。用它當比對基準，誤差會大過相鄰調子之間的差距，
#   ΔE 就失去意義了。
#
#   要填實際值有三條路，準確度由高到低：
#     1. 色差儀量實際布樣 → 最準，也是布廠驗色在用的
#     2. 色卡平放、平掃（掃描器，不是手機）→ 夠用
#     3. 手機拍：色卡平放、自然光、不要有陰影，旁邊放一張白紙當白平衡參考
#
#   填法：在下面每一格加 lab: [L, a, b] 或 hex: "#RRGGBB"。
#   只填您常用的那幾個也可以 —— 沒填的就不參與色號比對，
#   系統會退回只報色相族，不會拿猜的值冒充規格。

tones:            # 個位數
  "0": {name: "淡",     desc: "很亮、彩度低"}
  "1": {name: "淺",     desc: "亮、彩度中低"}
  "2": {name: "明",     desc: "亮而清晰"}
  "3": {name: "明亮",   desc: "彩度最高的亮色"}
  "4": {name: "明灰",   desc: "亮但帶灰"}
  "5": {name: "純色",   desc: "該色相的飽和本色"}
  "6": {name: "深色",   desc: "暗而仍有彩度"}
  "7": {name: "濁色",   desc: "偏暗且帶灰"}
  "8": {name: "暗色",   desc: "很暗"}
  "9": {name: "偏光黑", desc: "近黑，帶一點色相"}

families:         # 十位數
  "1": {name: "紅色", hue_deg: [10, 48]}
  "2": {name: "橘色", hue_deg: [48, 75]}
  "3": {name: "黃色", hue_deg: [75, 110]}
  "4": {name: "綠色", hue_deg: [110, 200]}
  "5": {name: "藍色", hue_deg: [200, 300]}
  "6": {name: "紫色", hue_deg: [300, 358]}
  # 茶色不是一個獨立色相 —— 它是低彩度、低明度的橘黃。
  # 所以要在橘與黃之前先判它，否則咖啡色會被歸成橘色。
  "7": {name: "茶色", hue_deg: [38, 95], max_chroma: 50, max_lightness: 78, priority: true}
  "8": {name: "無色", achromatic: true, max_chroma: 12}
  "9": {name: "特殊", metallic: true}   # 金銀銅無法用單一色值表示，不參與比對

