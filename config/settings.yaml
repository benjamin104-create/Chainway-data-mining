# ============================================================
# Chainway 服飾特徵 × 銷售數據 交叉分析平台 — 主設定檔
# 進公司後只需要改這一個檔案，其餘程式不用動。
# ============================================================

project:
  name: "Chainway 服飾設計數據平台"
  brand_tone: "英倫學院 / 優雅通勤 / 經典格紋"
  locale: "zh-TW"

# ------------------------------------------------------------
# 1. 資料夾位置
#
# ⚠️ Windows 路徑一律用「正斜線 /」，不要用反斜線 \
#    原因：YAML 的雙引號字串裡 \ 是跳脫字元，"C:\Users\..." 的 \U 會被
#    當成 Unicode 跳脫而直接解析失敗。三種安全寫法：
#        ✅ "C:/Users/USER/Desktop/商品設計Raw Data"     ← 建議用這種
#        ✅ 'C:\Users\USER\Desktop\商品設計Raw Data'      ← 單引號也可以
#        ❌ "C:\Users\USER\Desktop\商品設計Raw Data"      ← 會噴解析錯誤
#    Python 端一律用 pathlib.Path 處理，正斜線在 Windows 完全正常。
#
# root  = 你放原始資料的根目錄。底下五個「來源」若填相對路徑，
#         就會自動接在 root 底下；填絕對路徑則各自獨立（可以散在不同磁碟）。
# 產出類（interim/processed/outputs/feedback）一律留在專案內，
#         不會寫進你的 root，避免汙染原始資料夾。
# ------------------------------------------------------------
# 每一項都可以填「單一資料夾」或「資料夾清單」。同一種資料散在多個
# 資料夾是常態，填清單就好，不需要為了配合程式去搬檔案。
#
# ⚠️ 這裡設定的資料夾一律「只讀不寫」。程式不會修改、移動或刪除你的任何原始檔，
#    也不會碰 .agents / AGENTS.md / INDEX.md / Codex skill 這些既有的工具設定。
paths:
  # 你的原始資料根目錄（不使用時整行註解掉，會退回專案內的 data/raw/）
  root: "C:/Users/USER/Desktop/商品設計Raw Data"

  # ── 依 INDEX.md（2026-08-24）的「資料來源總覽」設定 ────────────
  # INDEX 明確指出：00_核心資料 ~ 05_案例 是「產出區」，不是原始證據來源。
  # 真正的原始資料只有根目錄這五個資料夾。

  system_images: "系統圖"           # ✓ 約 3,729 檔（JPG 為主，少量 PSD），依季號分類
  tech_packs: "裁縫指示書"           # ✓ 約 3,489 檔（2,548 XLS + 741 XLSX）

  market_research: "新格紋"          # ✓ 86 檔，2020–2024 命名格紋 / PDF / AI / PSD

  knowledge:                        # ✓ 服裝設計知識與決策準則
    - "Codex skill"                 #   145 張《基礎服裝畫原理與構造》頁面照片
    - "00_核心資料"                  #   品牌定位、核心原則、禁止事項（決策準則）

  pos: "銷售資料excel"              # ✓ 進銷存報表（KA135_2024_0828.xls 等 11 檔）

  # ── 電子目錄：刻意不納入掃描 ────────────────────────────────
  # 約 20,558 檔 / 58.9 GB，且 INDEX 註明「許多攝影檔沒有產品貨號」。
  # 全部跑 CLIP 會非常耗時且大量檔案無法對應貨號，成本效益不合。
  # 真要用（做季別層級的視覺分析）再解除下面這行的註解：
  #   market_research: ["新格紋", "電子目錄"]

  # 掃描時自動略過：tmp、以點開頭的資料夾（含 .agents）、~$ 暫存檔、
  # Thumbs.db、desktop.ini。

  # ── 產出類：固定在專案內，不受 root 影響，不會寫進你的資料夾 ──
  feedback: "data/feedback"         # ★ 人工填寫的暢銷/滯銷理由
  interim: "data/interim"
  processed: "data/processed"
  outputs: "data/outputs"

# ------------------------------------------------------------
# 2. 貨號（SKU）解析規則
#    系統圖檔名、裁縫指示書、POS 三邊要靠貨號串起來。
#    下面的 regex 請依貴司實際貨號格式調整。
#    範例貨號：CW24AW-TP-0135-BLK  →  style_code = CW24AW-TP-0135
# ------------------------------------------------------------
sku:
  # 貨號格式（已由 11 份 POS 檔、1,570 筆實際資料驗證，100% 符合）：
  #
  #     K A 1 5 8 3 0 0 8
  #     └┬┘ └─┬─┘ │ └─┬─┘
  #      │    │   │   └─ 流水號 3 碼
  #      │    │   └───── 品類碼 1 碼（見下方 category_map）
  #      │    └───────── 季號 3 碼（158 = 2026夏，見 seasons）
  #      └────────────── 固定字首 KA
  #
  filename_pattern: "(KA\\d{7})"
  # 沒有顏色／尺寸尾碼，貨號本身即款號
  style_code_pattern: null
  # POS 檔中貨號欄位可能的名稱（大小寫不拘、會自動比對）
  pos_sku_columns: ["貨號", "商品編號", "品號", "SKU", "款號", "item_no", "style_no"]
  # 從路徑或檔名擷取 KA 季號（系統圖與裁縫指示書都依季號分資料夾）
  season_code_pattern: "KA(\\d{3})"

  # ── 品類碼（貨號第 6 碼起）──────────────────────────────────
  # 結構是變動長度的，這點很容易看漏：
  #   5 開頭 → 品類碼「兩碼」，後接 2 碼流水（KA136-51-06）
  #   其餘   → 品類碼「一碼」，後接 3 碼流水（KA158-3-008）
  # 5 是「經典格紋（卡其格）」產品線，第二碼才是身體部位。
  # 已驗證：5 開頭的第二碼只出現 1/2/3/4/6/7/9，完全沒有 5/8/0。
  category_digit_index: 5
  category_map:
    "1": {category: "TOP",           sub: "梭織上衣/襯衫", note: "127/146 品名含上衣或襯衫"}
    "2": {category: "BOTTOM_PANTS",  sub: "褲",           note: "154/179 品名含褲"}
    "3": {category: "TOP",           sub: "棉T/T恤",      note: "273/360，品名多為棉T、帽T"}
    "4": {category: "BOTTOM_SKIRT",  sub: "裙",           note: "197/201 品名含裙"}
    "6": {category: "OUTER",         sub: "外套",         note: "140/155 品名含外套"}
    "7": {category: "DRESS",         sub: "洋裝",         note: "56/72 品名含洋裝"}
    "9": {category: "TOP",           sub: "針織",         note: "208/211，品名幾乎都含針織"}
    # 8 字頭是「魅力商品／贈品」，多數為滿額贈。它們不是服飾，
    # 也不是賣出去的（67% 銷貨額為 0，其他品類只有 11%），
    # 混進績效分析會出現「吸管杯售罄率 100% 排在暢銷榜前段」這種結論。
    "8": {category: "GIFT",          sub: "贈品/魅力商品", note: "電風扇、行李箱、購物袋、保溫瓶等",
          exclude_from_performance: true}

  # 經典格紋產品線：第二碼才是身體部位（品名相符率見 note）
  plaid_prefix: "5"
  plaid_category_map:
    "1": {category: "TOP",          sub: "格紋上衣",  note: "58 款，84% 品名相符"}
    "2": {category: "BOTTOM_PANTS", sub: "格紋褲",    note: "15 款，100%"}
    "3": {category: "TOP",          sub: "格紋T",     note: "42 款，62%"}
    "4": {category: "BOTTOM_SKIRT", sub: "格紋裙",    note: "60 款，100%"}
    "6": {category: "OUTER",        sub: "格紋外套",  note: "17 款，76%"}
    "7": {category: "DRESS",        sub: "格紋洋裝",  note: "32 款，97%"}
    "9": {category: "TOP",          sub: "格紋針織",  note: "4 款，樣本少"}
  # 格紋是品牌核心，「格紋款 vs 一般款哪個好賣」現在可直接由貨號回答，
  # 不必等 CLIP 判圖案。product_line 欄位會標成「經典格紋」或「一般」。
  plaid_line_label: "經典格紋"

  # 品類碼 5（或品類碼缺漏）時，改以品名關鍵字判斷。順序即優先序。
  name_category_rules:
    - {pattern: "洋裝|連身裙|長洋|禮服",           category: "DRESS",          sub: "洋裝"}
    - {pattern: "外套|大衣|風衣|夾克|斗篷|羽絨",    category: "OUTER",          sub: "外套"}
    - {pattern: "褲裙",                          category: "BOTTOM_SKIRT",   sub: "褲裙"}
    - {pattern: "褲",                            category: "BOTTOM_PANTS",   sub: "褲"}
    - {pattern: "裙",                            category: "BOTTOM_SKIRT",   sub: "裙"}
    - {pattern: "包|帽子|毯|保溫|傘|杯|鍋|抱枕|手機", category: "ACC",         sub: "配件/生活雜貨"}
    - {pattern: "針織|毛衣",                      category: "TOP",            sub: "針織"}
    - {pattern: "棉T|T恤|帽T|長版T",              category: "TOP",            sub: "棉T/T恤"}
    - {pattern: "上衣|襯衫|背心|罩衫|衫",          category: "TOP",            sub: "梭織上衣/襯衫"}

  # ── 樣衣／樣品辨識 ────────────────────────────────────────────
  # 報表裡混著大量樣衣（累進通常是 1，品名直接寫「樣衣」「樣裙」，
  # 或寫成「1571007樣衣」指向母款）。它們不是商品，
  # 混進去會佔滿滯銷榜（實測 121 筆「賣 0」其實幾乎都是樣衣）。
  sample_detection:
    name_patterns: ["樣衣", "樣裙", "樣品", "樣版", "打樣", "sample"]
    max_qty: 2            # 累進 ≤ 此數且無銷售，視為樣品
    # 「1571007樣衣」這種品名帶母款號的，可回推母款
    parent_in_name_pattern: "(\\d{7})"

  # ── 改番號家族（同一設計跨季重出）──────────────────────────
  # 實測有 10 組設計以不同番號重複出現，售罄率差距極大
  # （熊頭針織外套：2025秋 0% → 2025冬 88%）。
  # 不把它們認成同一設計，會(1)重複計算 (2)把「上錯季節」誤判成「設計失敗」。
  design_family:
    key_fields: ["product_name", "list_price"]   # 同品名 + 同定價視為同一設計
    normalize_name: true                          # 比對前去除空白與全半形差異

  # 設計師代號正規化：同一人有多組代號／大小寫不一，不修正會被算成不同人。
  # （實測：E049/e049 同人 729 筆；E071/e071/M044 同為陳潔如 454 筆）
  designer_aliases:
    "E049": "徐嘉欣"
    "E071": "陳潔如"
    "M044": "陳潔如"
    "E086": "李幸真"
    "E084": "陳可薇"
    "CW53": "張雅如"
    "E027": "李佩珊"

# ------------------------------------------------------------
# 2-1. 季別碼 → 季名與袖長
#      季號的末碼即季別碼。袖長是「季別層級」的屬性（貴司提供），
#      不是逐款判定 —— 報表只有 15.8% 的上衣在品名裡寫了袖長，
#      靠品名做長短袖分析會有 84% 的缺漏，用季別碼才涵蓋全部。
#
#      ⚠️ 這是季別的預設袖型，不代表該季每一款都是這個袖長。
#         若某季含例外款（如秋季的長袖外套），仍會計入該季統計。
#         要做到逐款袖長，需跑 embed 讓 Fashion-CLIP 判系統圖。
# ------------------------------------------------------------
season_terms:
  "7": {name: "早春", sleeve: "長袖", group: "SS", order: 1}
  "8": {name: "夏",   sleeve: "短袖", group: "SS", order: 2}
  "5": {name: "秋",   sleeve: "短袖", group: "AW", order: 3}
  "6": {name: "冬",   sleeve: "長袖", group: "AW", order: 4}

# ------------------------------------------------------------
# KA 季號對照表（來源：INDEX.md 2026-08-24「季別與代號對照」）
#      末碼規則見上方 season_terms：7=早春 8=夏 5=秋 6=冬
#      系統圖與裁縫指示書的資料夾名多為季號，靠這張表就能自動補上季別，
#      不必等 POS 報表有季別欄位。
#      term / group 由末碼自動帶入，這裡只需要維護年份。
# ------------------------------------------------------------
seasons:
  KA106: {year: 2021, term: "冬", group: "AW"}
  KA107: {year: 2021, term: "早春", group: "SS"}
  KA108: {year: 2021, term: "夏", group: "SS"}
  KA115: {year: 2022, term: "秋", group: "AW"}
  KA116: {year: 2022, term: "冬", group: "AW"}
  KA117: {year: 2022, term: "早春", group: "SS"}
  KA118: {year: 2022, term: "夏", group: "SS"}
  KA125: {year: 2023, term: "秋", group: "AW"}
  KA126: {year: 2023, term: "冬", group: "AW"}
  KA127: {year: 2023, term: "早春", group: "SS"}
  KA128: {year: 2023, term: "夏", group: "SS"}
  KA135: {year: 2024, term: "秋", group: "AW"}
  KA136: {year: 2024, term: "冬", group: "AW"}
  KA137: {year: 2024, term: "早春", group: "SS"}
  KA138: {year: 2024, term: "夏", group: "SS"}
  KA145: {year: 2025, term: "秋", group: "AW"}
  KA146: {year: 2025, term: "冬", group: "AW"}
  KA147: {year: 2025, term: "早春", group: "SS"}
  KA148: {year: 2025, term: "夏", group: "SS"}
  KA155: {year: 2026, term: "秋", group: "AW"}
  KA156: {year: 2026, term: "冬", group: "AW"}
  KA157: {year: 2026, term: "早春", group: "SS"}
  KA158: {year: 2026, term: "夏", group: "SS"}

# ------------------------------------------------------------
# 3. 影像特徵（Fashion-CLIP）
# ------------------------------------------------------------
clip:
  model_id: "patrickjohncyh/fashion-clip"   # HuggingFace 模型
  device: "auto"                            # auto / cpu / cuda / mps
  batch_size: 16
  image_size: 224
  # 影像前處理：系統圖已去背，補白底可讓 CLIP 更穩定
  pad_to_square: true
  background: "#FFFFFF"
  # 系統圖底部有印貨號的純色字幕帶，會被 CLIP 一起編碼進去，
  # 干擾色系與面料判讀。預設自動偵測並裁掉。
  strip_caption: true
  # 一張系統圖含多個配色時，切成單件後各自建向量。
  # 不切的話，查詢端的單件照片是拿去跟「一張混合圖」比對，相似度被稀釋，
  # 這是以圖搜貨號不準最大的單一原因。
  split_colorways: true
  # ⚠️ 已知限制：一張系統圖常同時放兩個以上的配色（例如白 + 藏青）。
  #    CLIP 對這種圖給出的「色系」不可信，該屬性的分析要排除多配色的圖，
  #    或改由 POS 的色號欄位提供顏色。目前色系標註會一併輸出信心值，
  #    多配色圖的信心通常偏低，可用 attr_uncertain_count 篩掉。
  cache_dir: "data/interim/clip_cache"

# ------------------------------------------------------------
# 4. 銷售績效分級（暢銷 / 普通 / 滯銷）
#    以「同品類、同季別」為分母做分位數切割，避免大品類壓死小品類。
# ------------------------------------------------------------
performance:
  group_by: ["season", "category"]      # 分組基準
  primary_metric: "sell_through_rate"   # 售罄率 = 銷量 / 進貨量
  secondary_metrics: ["net_sales_qty", "net_sales_amount", "gross_margin", "weeks_on_sale"]
  # 分級門檻（分位數）
  bands:
    star: 0.80        # 前 20% → 暢銷（Star）
    core: 0.50        # 20~50% → 主力（Core）
    slow: 0.20        # 50~80% → 平銷（Steady）；後 20% → 滯銷（Slow）
  # 上市未滿這個週數的商品不列入分級（避免新品被誤判滯銷）
  min_weeks_on_sale: 4
  # 進貨量低於此數的款不列入分析（樣本太小）
  min_stock_in: 30

# ------------------------------------------------------------
# 5. 關聯性分析
# ------------------------------------------------------------
analysis:
  # 卡方 / Cramér's V 的最低樣本數
  min_samples_per_cell: 5
  # 顯著水準
  alpha: 0.05
  # 每個品類最多輸出幾條關聯結論
  top_n_findings: 15
  # 特徵重要度模型（gbdt 需要 scikit-learn；沒裝會自動退回純統計）
  feature_importance_model: "gbdt"

# ------------------------------------------------------------
# 6. 以圖反查貨號（Reverse Visual Search）
# ------------------------------------------------------------
search:
  index_backend: "auto"     # auto / faiss / numpy
  top_k: 12
  metric: "cosine"
  # 是否在搜尋結果一併回傳價格與績效分級
  attach_price: true
  attach_performance: true

# ------------------------------------------------------------
# 7. 線稿生成（市調照片 → 機械圖線稿）
# ------------------------------------------------------------
sketch:
  engine: "xdog"            # xdog（推薦） / canny / hed（需額外模型）
  xdog:
    sigma: 0.8
    k: 4.5
    gamma: 0.97
    epsilon: -0.1
    phi: 200
  line_width: 2
  output_size: 1600         # 長邊像素
  vectorize: true           # 是否輸出 SVG（需 potrace 或 Adobe image_vectorize）
  annotation_font: null     # 中文標註字型路徑，例如 "C:/Windows/Fonts/msjh.ttc"
  render_palette_colors: 6  # 彩現圖的色彩量化數

# ------------------------------------------------------------
# 8. 系列企劃（週度波段）
# ------------------------------------------------------------
planning:
  styles_per_year: 450
  styles_per_week_min: 10
  styles_per_week_max: 15
  new_ratio: 0.65           # 新品開發佔比（其餘由 15 年庫存調用）
  tops_per_bottom: 2.5      # 1 款下身要搭 2.5 款上衣
  waves:                    # 年度波段
    - {code: "SS-EARLY", name: "早春", weeks: "W01-W06"}
    - {code: "SS-MAIN",  name: "春夏主力", weeks: "W07-W18"}
    - {code: "SS-LATE",  name: "盛夏", weeks: "W19-W26"}
    - {code: "AW-EARLY", name: "初秋", weeks: "W27-W35"}
    - {code: "AW-MAIN",  name: "秋冬主力", weeks: "W36-W45"}
    - {code: "AW-LATE",  name: "深冬/節慶", weeks: "W46-W52"}

# ------------------------------------------------------------
# 9. 報告輸出
# ------------------------------------------------------------
report:
  formats: ["html", "xlsx"]
  include_thumbnails: true
  thumbnail_size: 180
