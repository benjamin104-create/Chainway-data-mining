# ============================================================
# ★ 客戶意見調查 — 題目與受控詞彙
# ------------------------------------------------------------
# 這份檔案是「題目的唯一版本」。表單預覽、貼進 LINE／Google 表單的
# 題目稿、回收 CSV 的欄位對照，三者都從這裡長出來 ——
# 改一個地方，三邊一起改。分三份維護，第二個月就會對不起來。
#
# ★ 進公司後請和行銷主管一起改這份（尤其是「服務體驗」那幾題，
#   那幾題會被門市看見，措辭要是公司說得出口的話）。
# ============================================================

meta:
  title: "這次購物，還可以嗎？"
  # 60 秒是設計上限，不是估計值。超過就會有人中途離開，
  # 而中途離開的人不是隨機的 —— 通常是不滿意、趕時間的那群，
  # 剛好是最需要聽見的那群。所以題目寧可少，不要多。
  target_seconds: 60
  reward: "填完就抽 500 元禮金（每月抽 10 位）"

# ------------------------------------------------------------
# 一、這次買了什麼（把意見綁到真實交易）
# ------------------------------------------------------------
# 為什麼一定要有發票：沒有發票，這份表就只是意見；有發票，它可以
# 接到貨號、金額、門市、日期，變成可以和售罄率放在一起看的資料。
# 發票號碼由 LINE 那端帶進來，客人不用重打 —— 每多一個要打的欄位
# 就少一批人填完。
# ------------------------------------------------------------
invoice:
  prefill_from_line: ["invoice_no", "store", "purchase_date"]
  # 帶不進來的時候才問，而且只問發票號碼（門市和日期查得到）
  fallback_ask: ["invoice_no"]

# ------------------------------------------------------------
# 二、試穿了但沒買（這份表最值錢的一題）
# ------------------------------------------------------------
# POS 只記錄「買了什麼」。試穿了卻放回去的那一件，公司完全看不到，
# 而那一件離成交只差一步 —— 它比任何一件賣出去的衣服更能告訴你
# 「差在哪裡」。這是開這份問卷唯一不可取代的理由。
#
# 選項全部是「發生過的事」，不是「你希望怎樣」。
# 客人預測不了自己下一季會買什麼，問了只會得到一個看起來很有信心
# 的雜訊；但客人記得清楚自己二十分鐘前為什麼把那件放回去。
# ------------------------------------------------------------
tried_not_bought:
  question: "有沒有試穿了、但最後沒買的？"
  # 「有／沒有」本身也要有代碼。工具匯出的是中文字面，
  # 沒有代碼就只能拿字串比對，而行銷把「沒有」改成「都買了」那天，
  # 統計會靜靜地少一整類 —— 不會報錯，只會讓比例變得好看。
  options:
    - {code: "T_NO",  zh: "沒有"}
    - {code: "T_YES", zh: "有"}
  ask_which: "是哪一件呢？（記得幾號就填，不記得可以形容）"
  reasons:
    - {code: "T_SIZE_NONE",   zh: "沒有我的尺寸"}
    - {code: "T_SIZE_FIT",    zh: "尺寸有，但穿起來不合"}
    - {code: "T_COLOR",       zh: "想要的顏色沒有"}
    - {code: "T_PRICE",       zh: "價格考慮一下"}
    - {code: "T_MATCH",       zh: "想不到怎麼搭"}
    - {code: "T_FABRIC",      zh: "布料摸起來不喜歡"}
    - {code: "T_STYLE",       zh: "款式跟想像的不一樣"}
    - {code: "T_THINK",       zh: "還在考慮，可能會再回來"}
    - {code: "T_TIME",        zh: "時間不夠，沒看完"}

# ------------------------------------------------------------
# 三、想找但沒找到（缺什麼，不是想要什麼）
# ------------------------------------------------------------
# 同樣是「發生過的事」：他今天是帶著目的走進來的，而那個目的沒有
# 被滿足。這比「您希望我們多做什麼」可信得多。
# ------------------------------------------------------------
looking_for:
  question: "今天有想找、但沒找到的東西嗎？"
  options:
    - {code: "L_NONE",        zh: "沒有，想找的都有"}
    - {code: "L_CATEGORY",    zh: "某個品項沒有（例如想找外套但沒看到適合的）"}
    - {code: "L_SIZE",        zh: "尺寸不齊"}
    - {code: "L_COLOR",       zh: "顏色選擇太少"}
    - {code: "L_OCCASION",    zh: "找不到適合某個場合穿的"}
    - {code: "L_PRICE_BAND",  zh: "找不到這個價位帶的"}
  free_text: "方便的話，說說是什麼？"

# ------------------------------------------------------------
# 四、服務體驗（和商品分開問、分開報）
# ------------------------------------------------------------
# 為什麼要分開：服務不好會把商品的分數一起拉低。壓在一起問，
# 一件好衣服會因為那天店員很忙而被記成滯銷 —— 然後設計部門
# 改了不該改的東西。
# ------------------------------------------------------------
service:
  question: "今天在店裡的感覺"
  scale: ["很好", "還可以", "不太好"]
  aspects:
    - {code: "SV_GREET",   zh: "進門的招呼，剛剛好嗎"}
    - {code: "SV_ADVICE",  zh: "店員的建議有幫上忙嗎"}
    - {code: "SV_SPACE",   zh: "試衣間與店裡環境"}
    - {code: "SV_CHECKOUT", zh: "結帳的流程"}
  # 只有選「不太好」才展開這一題。全部都好的人不必被追問，
  # 而不好的那個人本來就有話想說。
  followup_if_bad: "發生了什麼事？（會直接送到門市主管，不會給當班店員看）"

# ------------------------------------------------------------
# 五、還會再來嗎（一題就好）
# ------------------------------------------------------------
# 不用 0–10 分的 NPS。十一個格子在手機上點不準，而且台灣人給分
# 集中在 8–9，區分度很低。三選一，看得懂也點得到。
# ------------------------------------------------------------
return_intent:
  question: "下次還會再來嗎？"
  options:
    - {code: "R_YES",    zh: "會，我常來"}
    - {code: "R_MAYBE",  zh: "有適合的就會"}
    - {code: "R_NO",     zh: "應該不會"}
  followup_if_no: "如果願意說，是什麼原因？"

# ------------------------------------------------------------
# 六、穿過之後（第二次接觸，約三週後才問）
# ------------------------------------------------------------
# 這幾題當天問不到答案 —— 縮水、起毛球、退色要洗過穿過才知道。
# 而這正是最貴的資料：它對應到 feedback_tags.yaml 的 S_QC，
# 是「暢銷但退貨吃掉毛利」那種款唯一的早期警訊。
# 三週後用 LINE 再推一次，只有三題。
# ------------------------------------------------------------
after_wear:
  delay_days: 21
  question: "上次買的那件，穿起來還好嗎？"
  options:
    - {code: "W_GOOD",     zh: "很滿意，會想再買同系列"}
    - {code: "W_OK",       zh: "還可以"}
    - {code: "W_SHRINK",   zh: "洗過之後縮水或變形"}
    - {code: "W_PILL",     zh: "起毛球"}
    - {code: "W_FADE",     zh: "退色"}
    - {code: "W_UNCOMFY",  zh: "穿起來不舒服（刺／悶／卡）"}
    - {code: "W_UNWORN",   zh: "老實說還沒穿"}

# ------------------------------------------------------------
# 抽獎規則（寫在表單上，不放在條款裡）
# ------------------------------------------------------------
lottery:
  # 抽獎資格和「填什麼」完全無關 —— 這一條一定要印在表單最上面。
  # 獎勵綁著滿意度，買到的就是讚美；讚美沒有資訊，而且會讓整份
  # 資料失去用途，卻看不出來哪裡壞掉。
  qualify: "上傳發票就有抽獎資格，跟您填什麼完全沒有關係"
  # 一張發票一次。不然一個人可以填十份，把樣本變成他個人的意見。
  unit: "一張發票一次"
  disclose_on_form: true
